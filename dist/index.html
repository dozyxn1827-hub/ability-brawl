<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>능력 난투</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  /* 아케이드의 밤: 남색 잉크 바탕, 산호색 버튼, 금색 제목. 부작용만 약 봉투 경고 라벨의 연두색을 쓴다. */
  --ink: #15122b;
  --panel: #221c46;
  --panel-2: #2e2660;
  --line: #4a3f8f;
  --paper: #f6edd9;
  --muted: #a79fce;
  --hot: #ff4d6d;
  --gold: #ffcf3a;
  --mint: #44e5c2;
  --warn: #c5f24a;
  --shadow: #0b0820;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --pix: "Press Start 2P", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  background-image: radial-gradient(var(--panel) 1px, transparent 1px);
  background-size: 12px 12px;
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
#app { min-height: 100%; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 26px; }
h3 { font-size: 19px; }
button, input, textarea { font: inherit; color: inherit; }
canvas { display: block; }

.page { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
.step { font-family: var(--pix); font-size: 9px; letter-spacing: 0.04em; color: var(--gold); }
.hint { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; }

.panel { background: var(--panel); border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.btn {
  font-family: var(--display); font-size: 17px; line-height: 1.1;
  background: var(--panel-2); color: var(--paper); border: 3px solid var(--line);
  padding: 12px 16px; cursor: pointer; box-shadow: 0 4px 0 var(--shadow);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .pb:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--hot); border-color: #ff9aae; color: #fff; }
.btn.primary:hover { border-color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.small { font-size: 14px; padding: 8px 12px; }
.btn.ghost { background: transparent; box-shadow: none; }

label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
input[type="text"], textarea {
  width: 100%; background: var(--ink); border: 3px solid var(--line); padding: 10px 12px; font-size: 16px; color: var(--paper); border-radius: 0;
}
textarea { resize: vertical; min-height: 84px; }
input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--gold); }
::placeholder { color: #6f67a0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-size: 13px; padding: 5px 9px; cursor: pointer; touch-action: manipulation; }
.chip:hover { color: var(--paper); border-color: var(--muted); }

.seg { display: inline-flex; border: 3px solid var(--line); }
.seg button { white-space: nowrap; background: var(--ink); border: 0; padding: 8px 12px; font-family: var(--display); font-size: 15px; cursor: pointer; color: var(--muted); min-width: 44px; }
.seg button + button { border-left: 3px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

/* 부작용 = 경고 라벨 */
.hazard-tag { display: inline-block; background: var(--warn); color: var(--ink); font-family: var(--display); padding: 1px 8px 2px; }
.stripe { height: 8px; background: repeating-linear-gradient(-45deg, var(--warn) 0 8px, var(--ink) 8px 16px); }

/* ----- 첫 화면 ----- */
.home { max-width: 760px; margin: 0 auto; padding: 0 0 40px; display: flex; flex-direction: column; gap: 20px; }
.hero { position: relative; }
.hero .stage { width: 100%; aspect-ratio: 3 / 2; border-bottom: 3px solid var(--line); }
.hero-copy { padding: 0 16px; margin-top: -34px; position: relative; display: flex; flex-direction: column; gap: 6px; }
.hero-copy h1 { font-size: clamp(54px, 17vw, 96px); color: var(--gold); text-shadow: 4px 4px 0 var(--hot), 8px 8px 0 var(--shadow); letter-spacing: -0.01em; line-height: 1; }
.tagline { font-size: 19px; font-family: var(--display); margin-top: 10px; }
.eyebrow { font-family: var(--pix); font-size: 9px; color: var(--mint); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; counter-reset: how; }
.how li { counter-increment: how; border-top: 3px solid var(--line); padding-top: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.how li::before { content: counter(how); font-family: var(--pix); font-size: 12px; color: var(--gold); }
.how li b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.how li:nth-child(2) b { color: var(--warn); }
.join { margin: 0 16px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.status span::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--line); margin-right: 6px; }
.status span.ok::before { background: var(--mint); }
.status span.no::before { background: var(--hot); }
@media (max-width: 520px) { .how { grid-template-columns: 1fr; } }

/* ----- 캔버스 무대 ----- */
.stage { position: relative; background: #0d0b2a; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .screen { image-rendering: pixelated; }

/* ----- 쓰기 화면 ----- */
.target { display: flex; flex-direction: column; gap: 2px; }
.who { font-family: var(--display); font-size: 16px; }
.quote { font-size: 16px; }
.quote::before { content: "“"; color: var(--muted); }
.quote::after { content: "”"; color: var(--muted); }
.side-card { border: 3px solid var(--line); background: var(--ink); display: flex; flex-direction: column; }
.side-card .in { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.side-card .row input { flex: 1 1 160px; }
.pass { text-align: center; align-items: center; padding: 34px 16px; }
.pass h2 { font-size: 32px; }

/* ----- 대기/진행 목록 ----- */
.plist { display: flex; flex-direction: column; gap: 6px; }
.plist li { display: flex; align-items: center; gap: 10px; background: var(--ink); border-left: 6px solid var(--pc, var(--line)); padding: 8px 10px; }
.plist .nm { font-family: var(--display); font-size: 17px; }
.plist .sub { color: var(--muted); font-size: 13px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.plist .badge { font-family: var(--pix); font-size: 8px; padding: 4px 6px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.plist .badge.done { background: var(--mint); color: var(--ink); }
.plist .badge.host { background: var(--gold); color: var(--ink); }
.bar { height: 8px; background: var(--panel-2); flex: 0 0 90px; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }

/* ----- 설계서 카드 ----- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.fcard { background: var(--panel); border: 3px solid var(--line); border-top: 8px solid var(--pc); box-shadow: 6px 6px 0 var(--shadow); display: flex; flex-direction: column; }
.fcard header { display: flex; gap: 12px; padding: 12px 12px 8px; align-items: center; }
.fcard .poses { width: 150px; height: 57px; flex: 0 0 150px; background: var(--ink); image-rendering: pixelated; border: 3px solid var(--line); }
.moves .mn { display: flex; align-items: center; gap: 6px; }
.moves .glyph { image-rendering: pixelated; flex: 0 0 auto; }
.fcard .fname { color: var(--pc); font-family: var(--display); font-size: 15px; }
.fcard h3 { font-size: 22px; }
.fcard .concept { font-size: 13px; color: var(--muted); }
.fcard .sec { padding: 8px 12px; border-top: 3px solid var(--panel-2); display: flex; flex-direction: column; gap: 6px; }
.fcard .ability { font-size: 15px; }
.fcard .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fcard .stats b { color: var(--paper); font-weight: 600; }
.moves li { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 8px; align-items: baseline; }
.moves .slot { font-size: 11px; color: var(--ink); background: var(--mc, var(--gold)); padding: 1px 4px; text-align: center; font-weight: 600; }
.moves .mn { font-family: var(--display); font-size: 16px; }
.moves .cd { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.moves .md { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.passive { font-size: 13px; }
.passive b { color: var(--mint); font-weight: 600; }
.draws { display: flex; flex-direction: column; gap: 8px; }
.draws li { background: var(--ink); border-left: 6px solid var(--warn); padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.draws .by { font-size: 12px; color: var(--warn); }
.draws .dh { font-size: 14px; }
.draws .mech { font-size: 12px; color: var(--muted); }
.fcard .src { font-family: var(--pix); font-size: 7px; color: var(--muted); padding: 8px 12px; border-top: 3px solid var(--panel-2); }
.sticky { position: sticky; bottom: 0; background: var(--ink); border-top: 3px solid var(--line); margin: 0 -16px -40px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ----- 전투 화면 ----- */
body.in-battle { overflow: hidden; overscroll-behavior: none; }
body.in-battle #app { height: 100%; }
.battle { height: 100%; display: flex; flex-direction: column; position: relative; user-select: none; -webkit-user-select: none; }
.hud { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; }
.hcard { background: var(--panel); border-left: 5px solid var(--pc); padding: 3px 6px 5px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hcard.ko { opacity: 0.4; }
.hcard .top { display: flex; align-items: center; gap: 5px; }
.hcard .hface { width: 26px; height: 26px; flex: 0 0 26px; image-rendering: pixelated; background: var(--ink); }
.hcard .n { font-family: var(--display); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.hcard .hpn { font-family: var(--pix); font-size: 8px; color: var(--muted); }
.hcard .hp { height: 8px; background: var(--ink); position: relative; }
.hcard .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pc); width: 100%; transition: width 0.08s; }
.hcard .hp b { position: absolute; left: 0; top: 0; bottom: 0; background: #f6edd9; width: 100%; }
.hcard .hp u { position: absolute; left: 0; top: 0; height: 3px; background: #7fd0ff; width: 0; }
.hcard .sts { display: flex; gap: 3px; height: 13px; overflow: hidden; }
.hcard .sts span { font-size: 9px; line-height: 13px; padding: 0 3px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.stage-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; position: relative; }
.bt-info { position: absolute; left: 0; right: 0; padding: 6px 10px; display: flex; gap: 10px; overflow: hidden; }
.bt-info div { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; color: var(--muted); }
.bt-info b { font-family: var(--display); font-weight: 400; font-size: 13px; color: var(--pc); }
.bt-info span { border-left: 4px solid var(--warn); padding-left: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bt-timer { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-family: var(--pix); font-size: 10px; background: var(--ink); color: var(--gold); padding: 4px 6px; z-index: 2; }
.bt-tools { position: absolute; top: 4px; right: 4px; z-index: 3; display: flex; gap: 4px; }
.bt-tools button { font-family: var(--pix); font-size: 8px; background: var(--ink); color: var(--muted); border: 2px solid var(--line); padding: 4px 6px; cursor: pointer; }
.bt-tools .snd { position: relative; }
.bt-tools .sndb { font-family: var(--body); font-weight: 700; font-size: 11px; color: var(--paper); padding: 3px 8px; height: 100%; }
.bt-tools .snd-pop { display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; flex-direction: column; gap: 4px; background: var(--ink); border: 2px solid var(--line); padding: 5px; box-shadow: 3px 3px 0 var(--shadow); }
.bt-tools .snd-pop.open { display: flex; }
.bt-tools .snd-pop button { font-family: var(--body); font-weight: 700; font-size: 12px; color: var(--paper); border-color: var(--gold); padding: 5px 12px; white-space: nowrap; }
.bt-tools .snd-pop button.off { color: var(--muted); border-color: var(--line); text-decoration: line-through; opacity: 0.7; }

.pads { display: flex; flex-direction: column; gap: 6px; padding: 6px 10px calc(10px + env(safe-area-inset-bottom)); touch-action: none; }
.pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.joy { position: relative; flex: 0 0 auto; width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle, var(--panel-2) 0 34%, var(--panel) 35%); border: 3px solid var(--line); touch-action: none; cursor: pointer; }
.joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--pc); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3); transform: translate(var(--jx, 0px), var(--jy, 0px)); }
.joy.is-down { border-color: var(--pc); }
.pad-act { display: grid; grid-template-columns: repeat(2, 78px); grid-auto-rows: 58px; gap: 6px; }
.pb {
  position: relative; overflow: hidden; background: var(--panel-2); border: 3px solid var(--line); color: var(--paper);
  font-family: var(--display); font-size: 13px; line-height: 1.1; padding: 2px; cursor: pointer; touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
  border-bottom-color: var(--pc, var(--line));
}
.pb.is-down { background: var(--line); }
.pb .glyph { position: relative; z-index: 1; width: 28px; height: 28px; image-rendering: pixelated; }
.pb.ready { animation: ready 0.35s steps(3); }
@keyframes ready { 0% { box-shadow: 0 0 0 0 var(--pc); background: var(--pc); } 100% { box-shadow: 0 0 0 8px transparent; } }
.pb .lbl { position: relative; z-index: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb .key { position: relative; z-index: 1; font-family: var(--pix); font-size: 7px; color: var(--muted); }
.pb .cdfill { position: absolute; inset: 0; background: rgba(11, 8, 32, 0.78); transform-origin: top; transform: scaleY(var(--cd, 0)); }
.pb .cdn { position: absolute; z-index: 2; right: 2px; top: 2px; font-family: var(--pix); font-size: 8px; color: var(--gold); }
.pb[data-k="u"] { border-color: var(--gold); }
.pb.off { opacity: 0.4; }
.pad.keys { justify-content: center; }
.pad.keys .pad-act { grid-template-columns: repeat(4, minmax(64px, 120px)); grid-auto-rows: 46px; }
.pad-help { text-align: center; font-size: 12px; color: var(--muted); }
/* 둘이 한 기기 */
.pads.duo .joy { width: 92px; height: 92px; }
.pads.duo .joy i { width: 36px; height: 36px; margin: -18px 0 0 -18px; }
.pads.duo .pad-act { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; flex: 1 1 auto; }
.pads.duo .pb { font-size: 11px; }

/* 가로로 든 휴대폰: 조작을 화면 위에 겹친다 */
@media (orientation: landscape) and (max-height: 520px) {
  .hud { position: absolute; top: 0; left: 0; right: 0; z-index: 2; background: none; opacity: 0.9; padding: 2px 112px; }
  .hcard .sts { display: none; }
  .pads { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; opacity: 0.8; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); pointer-events: none; }
  .pads .joy, .pads .pb { pointer-events: auto; }
  .pad-help { display: none; }
  .joy { width: 110px; height: 110px; }
  .pad-act { grid-template-columns: repeat(2, 60px); grid-auto-rows: 46px; }
  .pad-act .lbl, .pad-act .key { display: none; }
  .pb { opacity: 0.9; }
  .pads.duo { flex-direction: row; justify-content: space-between; align-items: flex-end; }
  .pads.duo .pad { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
  .pads.duo .pad:nth-child(2) { align-items: flex-end; }
  .pads.duo .joy { width: 96px; height: 96px; }
  .pads.duo .pad-act { grid-template-columns: repeat(2, 48px); grid-auto-rows: 40px; flex: 0 0 auto; }
  .bt-timer { top: auto; bottom: 4px; }
}

/* ----- 연습장 ----- */
.prac { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(11, 8, 32, 0.86); border: 2px solid var(--gold); box-shadow: 3px 3px 0 var(--shadow); padding: 4px 4px 4px 8px; display: flex; gap: 7px; align-items: center; white-space: nowrap; pointer-events: auto; }
.prac.all { border-color: #7dff8a; }
.prac-tag { font-family: var(--display); font-size: 14px; color: var(--gold); }
.prac-left { font-family: var(--pix); font-size: 10px; color: var(--paper); min-width: 2.2em; text-align: center; }
.prac-left.hot { color: var(--hot); }
.prac-marks { display: flex; gap: 6px; }
.prac-m { display: flex; gap: 2px; padding-left: 4px; border-left: 3px solid var(--pc); }
.prac-m i { font-style: normal; font-size: 10px; font-weight: 700; width: 17px; height: 17px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
.prac-m i.on { color: var(--ink); background: #7dff8a; border-color: #7dff8a; }
.prac-go { font-family: var(--body); font-weight: 700; font-size: 12px; background: var(--gold); color: var(--ink); border: 2px solid var(--ink); padding: 4px 9px; cursor: pointer; }
.prac-go:disabled { background: var(--line); color: var(--paper); cursor: default; }

/* ----- 결과 ----- */
.result { text-align: center; align-items: center; }
.result h2 { font-size: clamp(34px, 10vw, 56px); color: var(--gold); text-shadow: 3px 3px 0 var(--hot); }
.result .portrait { width: 120px; height: 120px; image-rendering: pixelated; }
@media (max-width: 420px) { .fcard header { flex-direction: column; align-items: flex-start; } }
table.score { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.score th, table.score td { padding: 6px 8px; text-align: right; border-bottom: 3px solid var(--panel-2); font-size: 14px; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score th { color: var(--muted); font-weight: 400; font-size: 12px; }
table.score td:first-child { font-family: var(--display); font-size: 16px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 8px 14px; font-size: 14px; z-index: 20; box-shadow: 4px 4px 0 var(--shadow); max-width: calc(100% - 32px); }
/* ----- 설계서 공개 경매 쇼 ----- */
body.ss-on { overflow: hidden; }
.reveal-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.ss { position: fixed; inset: 0; z-index: 60; background: #0b0820; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: pointer; animation: ssin 0.5s ease-out; }
.ss.out { animation: ssout 0.45s ease-in forwards; }
@keyframes ssin { from { opacity: 0; transform: scale(1.08); } }
@keyframes ssout { to { opacity: 0; transform: scale(0.94); } }
.ss-cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.ss-lot { position: absolute; top: 9%; left: 50%; transform: translate(-50%, -260%); display: flex; flex-direction: column; align-items: center; background: #15122b; border: 3px solid var(--gold); box-shadow: 0 0 0 3px #0b0820, 0 6px 0 #0b0820; padding: 4px 18px 6px; transition: transform 0.55s cubic-bezier(0.2, 1.5, 0.4, 1); pointer-events: none; max-width: 92%; }
.ss-lot.show { transform: translate(-50%, 0); }
.ss-lot .n { font-family: var(--pix); font-size: 9px; color: var(--gold); letter-spacing: 0.06em; }
.ss-lot .t { font-family: var(--display); font-size: clamp(18px, 3vw, 30px); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

      return `${f.chance < 100 ? f.chance + '% 확률로 ' : ''}${f.accel ? '점점 자주, ' : ''}${when} ${f.what ? `‘${f.what}’ ` : ''}“${f.text}”${what}${ex.length ? ' → ' + (f.later ? `${f.later}초 뒤에 ` : '') + ex.join(' + ') : ''}`;

    case 'ramp': return `${f.why || (f.by === 'hp' ? '체력이 줄수록' : '시간이 지날수록')} ` + { dmg: `위력이 줄어듦 (최대 -${f.pct}%)`, speed: `느려짐 (최대 -${f.pct}%)`, size: f.pct < 0 ? `작아짐 (최대 ${f.pct}%)` : `커짐 (최대 +${f.pct}%)` }[f.stat];

    case 'hpset': return `최대 체력이 ${f.hp}`;

    case 'dmgfix': return `${on} 맞히면 피해가 딱 ${f.n}`;
    case 'pspeed': return `${on} 날아가는 속도 ${f.pct > 0 ? '+' : ''}${f.pct}%`;
    case 'psize': return `${on} 공격 크기 ${f.pct > 0 ? '+' : ''}${f.pct}%`;
    case 'nofx': return { jump: '점프(도약) 기술이 안 나감', dash: '돌진 기술로 못 움직임', tele: '순간이동 기술이 안 나감', fly: '날 수 없음', heal: '회복이 전혀 안 됨', shield: '보호막이 안 생김', invis: '투명해질 수 없음', buff: '강화 효과를 못 받음', clone: '분신이 안 나옴', summon: '소환이 안 됨' }[f.what];
    case 'selfhit': return '내가 쏜 공격에 나도 맞음';
    case 'lure': return '적의 투사체가 나한테 휘어 들어옴 (피할 수 없음)';
    case 'exposed': return '모두에게 내 위치가 표시됨 + 투명 불가';
    case 'mute': return '게임 소리가 안 들림 (내 기기)';
    case 'dtrail': if (f.name) return `걸어간 자리에 ${josa(f.name, '이', '가')} 남음`;
      return `걸어간 자리에 ${{ fire: '불', poop: '똥', ice: '얼음', slime: '끈적이', water: '물웅덩이', flower: '꽃', squeak: '삑삑 소리', money: '돈' }[f.kind]}${{ fire: '이 남음 (밟으면 화상, 나도)', poop: '이 남음 (밟으면 미끄러짐, 나도)', ice: '이 남음 (밟으면 미끄러짐, 나도)', slime: '가 남음 (밟으면 느려짐, 나도)', water: '이 남음 (밟으면 미끄러짐, 나도)', flower: '이 핌', squeak: '가 남', money: '이 떨어짐' }[f.kind]}`;
    case 'pest': return `${f.on ? use(f) : f.every + '초마다'} ${josa(f.name, '이', '가')} 나타나 쫓아옴${f.st ? ` (닿으면 ${ST_KO[f.st.k]})` : ''}`;
    case 'look': return f.look && f.look.head === 'bald' ? '대머리가 됨' : f.look && f.look.hair && !f.look.body ? '머리 색이 바뀜' : '겉모습이 바뀜';
  }
  return '';
}

/** 글자만 보고 부작용을 추측 (AI가 없거나 실패했을 때) */
function guessDrawback(text) {
  // AI 답이 잘못됐을 때도 부작용 글을 글자 그대로 읽는다
  const r = smartDrawback(text, null);
  const fx = sanDfx(r.fx) || sanDfx({ t: 'act', every: 9, text: cut(text, 14) || '앗!', d: 0 });
  return { how: r.how, say: r.say, fx, more: (r.more || []).map(sanDfx).filter(Boolean), generic: !!r.generic };
}

/** 원본(AI 또는 기본 해석기) → 엔진이 믿고 쓸 수 있는 설계서. 부작용의 replace·look을 여기서 적용 */
function sanSpec(raw, sides, ai, keep) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const L = raw.look && typeof raw.look === 'object' ? raw.look : {};
  const look = {
    skin: col(L.skin, '#f2c79b'), hair: col(L.hair, '#3a2a4a'), body: col(L.body, '#4466cc'), accent: col(L.accent, '#ffcf3a'),
    head: oneOf(L.head, HEADS, 'short'), weapon: oneOf(L.weapon, WEAPONS, 'none'), aura: oneOf(L.aura, AURAS, 'none'), cape: bool(L.cape), outfit: oneOf(L.outfit, OUTFITS, 'plain'),
  };
  const S = raw.stats && typeof raw.stats === 'object' ? raw.stats : {};
  const stats = { hp: Math.round(num(S.hp, 70, 140, 100)), speed: r1(num(S.speed, 0.75, 1.35, 1)), size: r1(num(S.size, 0.8, 1.3, 1)) };
  const MV = raw.moves && typeof raw.moves === 'object' ? raw.moves : {};
  const moves = {};
  SLOTS.forEach((s) => {
    moves[s] = sanMove(MV[s], s, look, keep);
    if (keep && MV[s] && typeof MV[s].was === 'string') moves[s].was = str(MV[s].was, 12, '');
  });
  let passive = null;
  const pk = raw.passive && typeof raw.passive === 'object' ? (raw.passive.k === 'glide' ? 'swift' : raw.passive.k) : null;
  if (PASSIVES.includes(pk)) passive = { k: pk, desc: str(raw.passive.desc, 36, PASSIVE_KO[pk]) };
  const RD = Array.isArray(raw.drawbacks) ? raw.drawbacks : [];
  const drawbacks = (sides || []).map((s, i) => {
    const d = RD[i] && typeof RD[i] === 'object' ? RD[i] : {};
    let fx = sanDfx(d.fx);
    const extra = (Array.isArray(d.more) ? d.more : []).map(sanDfx).filter(Boolean).slice(0, 2);
    const g0 = ai ? guessDrawback(s.text) : null;
    if (g0 && !g0.generic) fx = null;
    const g = fx ? null : g0 || guessDrawback(s.text);
    fx = fx || g.fx;
    return {
      by: str(s.by, 12, '?'), text: str(s.text, 90, ''),
      how: fx === (g && g.fx) ? g.how : str(d.how, 60, dfxText(fx)),
      say: str(fx === (g && g.fx) ? g.say : d.say, 16, ''),
      fx, more: g ? g.more.slice(0, 2) : extra,
    };
  });
  // 바꿔치기·겉모습 부작용을 설계서에 그대로 적용
  if (!keep) {
    for (const d of drawbacks) for (const x of [d.fx].concat(d.more)) {
      if (x.t === 'replace') {
        for (const s in x.moves) {
          const was = moves[s].name;
          moves[s] = sanMove(x.moves[s], s, look, false);
          moves[s].was = was;
        }
        x.moves = Object.fromEntries(Object.keys(x.moves).map((s) => [s, 1]));
      } else if (x.t === 'look') Object.assign(look, x.look);
    }
  }
  const LN = raw.lines && typeof raw.lines === 'object' ? raw.lines : {};
  return {
    v: 4, ai: !!ai, title: str(raw.title, 14, '이름 없는 능력자'), concept: str(raw.concept, 70, ''),
    look, stats, moves, passive, drawbacks, lines: { intro: str(LN.intro, 16, ''), ko: str(LN.ko, 16, ''), win: str(LN.win, 24, '') },
  };
}

[이 게임이 원하는 세 가지]
1. 병맛: 어이없고 황당하고 과장될수록 좋다. "이게 왜 되냐" 싶은 해석이 정답이다.
2. 유쾌: 누구도 기분 나쁘지 않고 다 같이 웃는다. 비하·혐오·욕설 없이, 상황 자체가 웃기게.
3. 짜릿: 손맛이 시원해야 한다. 빠르게 쏘고, 크게 터지고, 궁극기는 화면이 뒤집히는 한 방.
진지한 밸런스보다 "방금 그거 봤어?!" 하는 순간이 중요하다. 능력이 부작용 때문에 망가지는 것도 재미다.

[게임 방식] 480x320px 아레나를 위에서 내려다본다. 캐릭터는 키 9px의 아주 작은 픽셀 사람이고 상하좌우로 빠르게 걸어 다닌다. 점프는 없다. 아레나에는 벽(이동·발사체를 막음)과 구덩이(이동만 막음)가 있고, 시간이 지나면 폭풍이 좁혀 온다. 모든 기술은 가장 가까운 적을 향해 자동으로 조준된다. 재사용 시간이 아주 짧아서 플레이어는 기술을 쉴 새 없이 난사한다. 맞을 때마다 화면에 만화 의성어가 터진다.
[중요] 주먹, 발차기, 무기 휘두르기 같은 평범한 공격은 없다. 플레이어는 오직 능력만 쓴다. 기술 네 개(basic=능력 1, s1=능력 2, s2=능력 3, ult=궁극기)는 모두 [능력]에서 직접 나온 효과여야 한다. 능력 1은 가장 자주 누르는 가벼운 능력이다.

[플레이어] ${name}
[능력] ${ability}
[부작용] 순서대로 drawbacks 배열에 하나씩, 같은 개수로 반영한다.
${sideList}

[설계 순서] 아래 순서대로 속으로 깊이 생각한 뒤 결과만 출력한다(생각 과정은 출력하지 않는다).
1. 해석: 능력 글을 단어 하나하나 글자 그대로 읽는다. 그 능력이 진짜로 있다면 싸움판에서 벌어질 웃긴 장면을 여러 개 떠올리고, 글에 가장 충실하면서 가장 황당한 해석을 고른다. 말장난, 과장, 일상 소재의 엉뚱한 활용, 숫자·조건의 지나치게 성실한 해석을 적극 쓴다. 가장 먼저 떠오르는 뻔한 해석은 한 번 더 비틀어 본다.
2. 콩트 구성: 네 기술이 한 편의 콩트처럼 이어지게 한다. 네 기술의 공격 방식이 모두 달라야 한다(발사체만 네 개는 금지). 액션 게임처럼 휘두르기(swing), 분사(cone), 충격파(wave), 땅 가르기(line), 연쇄(chain), 갈고리(hook), 포물선 투척(lob), 광선 쓸기(beam sweep), 반격 자세(buff counter)와 추가 공격 30종(운석, 찌르기, 띄우기, 도약, 난무, 회오리, 굴러가는 구체, 불벽, 그물, 지면파, 분신, 표식, 모아 쏘기, 미사일, 소용돌이, 낙뢰, 고리, 환영 베기, 나선 탄막, 세 갈래 광선, 채찍, 검의 비, 개틀링, 팽이, 신호탑, 저격, 돌풍, 흡혈 줄 등) 가운데 능력 글에 가장 어울리는 것을 골라 섞는다.
   · basic: 그 능력의 대표 개그를 가볍고 빠르게 연타. 쏠 때마다 손맛이 나게.
   · s1: 예상 밖으로 비튼 활용. 상태이상이나 장판으로 판을 깐다.
   · s2: 능력을 엉뚱하게 써서 도망·접근·방어·소환. 위기 탈출이나 기습.
   · ult: 능력을 말도 안 되는 규모로 키운 대참사. 이름은 거창하게, 효과는 화면 전체가 난리 나게(여러 효과를 겹치고, 큰 폭발·많은 발사체·광역 상태이상).
3. 연계: s1·s2가 깔아 둔 것(느려짐, 빙결, 끌어당김, 장판, 소환물)에 basic·ult가 시원하게 터지도록 짝을 맞춘다. 네 기술의 효과 종류(shot, beam, blast, zone, summon, dash, blink, trail 등)를 골고루 섞어 손에 쥐는 느낌이 전부 다르게 한다.
4. 손맛: 발사체는 빠르게(보통 speed 160 이상), 폭발은 크게, 궁극기 delay는 짧게(0.6초 이하). 아무 일도 안 일어나는 기술은 만들지 않는다. 단, 능력 글이 "느리다", "약하다"라고 하면 글이 우선이다.
5. 부작용: 능력을 비꼬는 반전 개그로 만든다. 글자 그대로 실행하되, 터지는 순간이 모두에게 보이고 들리게(say, shout, pest, look, morph, dance 등) 연출한다.
6. 말맛: 기술 이름은 짧고 외치기 좋게, say는 능력 글의 말투를 살린 한마디. 등장·쓰러짐·승리 대사(lines)는 캐릭터성이 드러나는 한 줄 개그.
7. 점검: 출력 전에 확인한다. 네 기술이 모두 능력 글에서 나왔는가? 흔한 원소 마법으로 도망치지 않았는가? 부작용이 글자 그대로인가? 궁극기가 충분히 과장됐는가? 숫자가 모두 범위 안인가? JSON 문법이 맞는가?

[해석 감각 참고] 아래는 생각하는 방식의 예일 뿐이다. 이 소재·이름·구성을 절대 베끼지 말고, 지금 받은 능력 글에서만 나올 수 있는 것을 만든다.
- 능력 글이 일상적인 행동이면, 그 행동을 말도 안 되게 과장해 무기로 쓴다(잔소리 → 귀에 꽂히는 잔소리 음파, 궁극기는 끝나지 않는 잔소리 폭풍).
- 능력 글이 사물이면, 그 사물의 생김새·쓰임새·소리를 하나씩 기술로 쪼갠다(우산 → 펼쳐 막기, 접어서 찌르듯 돌진, 궁극기는 하늘에서 우산 비).

[가장 중요한 원칙: 쓴 그대로 구현한다]
- 플레이어가 쓴 능력이 아무리 이상하고, 엉뚱하고, 말이 안 되고, 약하고, 쓸모없어 보이고, 마음에 들지 않아도 절대 거절하거나 다른 능력으로 바꾸지 않는다. 무조건 그 글에 가장 가까운 모습으로 만든다.
- 흔한 원소 마법(불, 얼음, 번개 등)으로 바꿔치기하지 않는다. 글에 없는 소재를 덧붙이지 않는다. 글에 나온 사물·행동·말투·숫자·조건을 기술 이름, 설명, 효과, 발사체 모양(shape·pix), 색, 소리(sfx), 외형(look)에 그대로 살린다.
- 네 기술 모두 그 능력의 서로 다른 활용법이어야 한다.
- 능력이 싸움과 상관없어 보여도 그 능력을 억지로라도 공격·방어·이동에 써먹는 방식을 찾아낸다. 능력이 약하다고 써 있으면 약한 대로, 이상하면 이상한 대로 만든다.
- 너무 강한 글("무적", "즉사", "무한" 등)도 뜻은 그대로 살리되, 수치만 아래 범위 안으로 맞춘다(짧은 무적, 큰 피해 등).

[부작용 원칙: 글자 그대로, 봐주지 않는다]
- 부작용은 쓴 문장을 글자 그대로 실행한다. "공격력 감소", "재사용 시간 증가" 같은 무난한 능력치 깎기로 바꿔치기하는 것은 금지다. 그런 DFX(stat, mul, cd)는 부작용 글이 정말로 그런 뜻일 때만 쓴다.
- 부작용이 능력의 일부를 못 쓰게 하면 그 부분은 정말로 못 쓴다. 예: 능력이 "불을 다룬다"이고 부작용이 "불을 못 쓴다"라면 불이 나오는 기술은 하나도 남으면 안 된다.
  · 막히는 기술이 일부면 그 기술만 lock 한다.
  · 능력 전체가 막히면 replace로 네 기술을 모두 "능력을 못 쓰는 채로 버둥대는 병맛 기술"로 바꾼다(라이터만 딸깍대기, 연기만 나오기, 성냥 던지기, 뜨거운 척하기 등). 바뀐 기술에서 원래 능력의 효과(예: 진짜 불)가 나오면 안 된다. 바뀐 기술은 아주 약해도 되지만, 버둥대는 모습이 웃기고 소리도 처량하게(sfx).
- 부작용이 능력을 다른 것으로 바꾸면(예: "불 대신 물이 나온다") replace로 그 기술들을 바뀐 모습으로 다시 만든다. 이름·pix·vfx·색·sfx까지 바뀐 모습으로.
- 부작용이 방향을 바꾸면 reverse, 적을 도와주면 healfoe·aidfoe, 엉뚱한 기술이 나가면 random, 걸음이 이상해지면 move, 화면이 이상해지면 vision, 무언가 쫓아오면 pest, 무슨 말을 해야 하면 shout, 겉모습이 바뀌면 look을 쓴다.
- 부작용 문장을 [언제]와 [무엇]으로 나눠 읽고 둘 다 그대로 지킨다. 숫자(2배, 절반, 3초 동안, 5번, 10초마다)와 조건(~하면, ~할 때마다, ~초마다, 맞으면, 가만히 있으면, 체력이 낮으면)을 바꾸지 않는다. 글에 없는 효과를 덧붙이지 않는다.
  · 예: "능력을 쓰면 3초 동안 못 움직인다" → {"t":"selfst","on":"skills","st":{"k":"root","d":3}} / "물에 약하다" → {"t":"weakto","vfx":["water"],"pct":100,"name":"물"} / "체력이 50밖에 없다" → {"t":"stat","stat":"hp","pct":50} / "3번 쓰면 기절한다" → {"t":"selfst","on":"skills","nth":3,"st":{"k":"stun","d":1.2}} / "가만히 있으면 체력이 준다" → {"t":"drain","amt":1.5,"if":"still"} / "체력이 낮으면 능력을 못 쓴다" → {"t":"when","if":"lowhp","st":"silence"} / "시간이 지날수록 약해진다" → {"t":"ramp","stat":"dmg","by":"time","pct":50}
- 부작용이 어떤 행동(방귀, 울기, 똥, 재채기, 딸꾹질, 노래, 웃기, 넘어지기, 잠들기 등)을 말하면 act로 캐릭터가 정말 그 행동을 하게 한다. 말풍선(text)에 그 행동 소리를, pose에 맞는 연출을 넣는다. 예: "똥을 싼다" → {"t":"act","every":10,"text":"뿌지직!","pose":"poop","d":1.4} / "맞으면 운다" → {"t":"act","hit":true,"text":"으앙~","pose":"cry","d":1.2} / "재채기를 하면 능력이 나간다" → {"t":"act","every":8,"text":"에취!!","pose":"sneeze","d":0.6,"fire":true}
- 조건과 사건은 최대한 글 그대로 고른다: "적을 맞히면"→"ev":"hitfoe", "적을 쓰러뜨리면"→"kill", "회복하면"→"heal", "상태이상에 걸리면"→"debuff", "적이 능력을 쓰면"→"foeskill", "순간이동하면"→"dash", "누가 죽으면"→"ally", "빗나가면"→"miss", "3번 맞으면"→{"hit":true,"nth":3}, "구석에 있으면"→"if":"edge", "가운데 있으면"→"center", "적이 여럿이면"→"crowd", "혼자 있으면"→"alone", "적 체력이 낮으면"→"foelow", "체력이 가득이면"→"fullhp", "5초 동안 능력을 안 쓰면"→{"if":"idle","n":5}, "궁극기가 준비되면"→"ready", "처음 10초"→{"if":"early","n":10}, "30초가 지나면"→{"if":"late","n":30}, "장판 위에 있으면"→"onzone", "능력을 쓰는 동안"→"casting", "1등이면"→"lead", "지고 있으면"→"behind", "5초 넘게 가만히 있으면"→{"if":"still","n":5}
- 게임에 없는 조건("비가 오면", "밤이 되면")은 몇 초마다 그 조건이 일어난 것으로 친다(act의 every + text에 그 조건). 예: "비가 오면 능력을 못 쓴다" → {"t":"act","every":11,"text":"비가 온다!","st":{"k":"silence","d":3}}
- 부작용 하나가 여러 효과를 뜻하면 fx에 대표 효과를, more에 나머지 효과(최대 2개)를 넣는다.
- how에는 게임에서 실제로 벌어지는 일을 웃기게 쓰고, say에는 그 부작용이 터질 때 캐릭터가 하는 말을 쓴다.
- 피해 예산(체력 100 기준, 기술 한 번의 총 피해): basic 6~12, s1 12~22, s2 15~28, ult 30~50. 강한 효과일수록 cd를 길게.
- 모든 글은 한국어, 전체 이용가. 숫자는 범위를 지킨다. 아래에 없는 값은 쓰지 않는다.

[연출 원칙] 이 게임은 연출이 생명이다. 기술마다 그 능력에서만 나올 법한 모습과 소리를 정한다.
- pix: 발사체·소환물·아이콘을 12x12 픽셀 그림으로 직접 그린다. 능력 글에 나온 사물을 그대로, 한눈에 알아볼 수 있게 자세히 그린다. 오른쪽을 향한 모습으로, 12글자짜리 문자열 12줄. '#' 기본색, 'o' 밝은 부분(왼쪽 위에서 빛이 온다), '.' 어두운 부분·그림자, 'w' 흰 반짝임, 'k' 검정(눈·선), ' ' 빈칸. 테두리는 게임이 자동으로 그린다. 표정(k 눈, w 반짝임)을 넣으면 더 웃기다.
- pix2: 같은 그림의 두 번째 애니메이션 프레임(날개 퍼덕임, 꼬리 흔들기, 입 벌리기, 불꽃 일렁임 등). 같은 규칙, 12줄.
- vfx: 잔상·폭발·장판의 느낌. 능력에 가장 어울리는 것을 기술마다 고른다.
- sfx: 기술 소리. kind는 그 기술이 실제로 낼 법한 소리를 고른다(방귀면 fart, 고양이면 meow, 오리·자동차면 honk, 먹는 거면 gulp·slurp, 노래면 kazoo·choir 등). pitch는 음 높이(0.5 굵고 낮게 ~ 2 가늘고 높게), len은 길이(0.5 짧게 ~ 2 길게). 같은 캐릭터의 네 기술 소리가 서로 다르게.
- say: 그 기술을 쓸 때 캐릭터가 외치는 짧은 대사(10자 이내, 능력 글의 말투를 살린다). 궁극기 say는 게임이 크게 읽어 준다.
- color: 기술마다 능력에 어울리는 색. 네 기술이 한 팔레트 안에서 서로 구별되게.

[출력] JSON 객체 하나만 쓴다. 설명·주석 금지.

BUFF: haste|shield|regen|power|armor|invis|giant|tiny|fly|reflect|invuln|counter(반격 자세: 그 시간 안에 처음 맞는 공격을 막고 되돌려 줌, 최대 2초)

ON: basic|s1|s2|ult|skills(네 능력 모두)
DFX:
 {"t":"lock","on":ON} 그 기술을 아예 못 씀(버튼을 눌러도 헛손질만)
 {"t":"replace","moves":{"basic"?:MOVE,"s1"?:MOVE,"s2"?:MOVE,"ult"?:MOVE}} 그 기술들을 부작용 때문에 바뀐 모습의 MOVE로 통째로 바꿈
 {"t":"reverse","on":ON,"chance":10~100} 기술이 적 반대 방향으로 나감
 {"t":"healfoe","on":ON,"chance":10~100} 맞은 적이 피해 대신 회복함
 {"t":"random","on":ON,"chance":10~100} 누른 기술 대신 자기 기술 중 아무거나 나감
 {"t":"fail","on":ON,"chance":10~100,"back":"fizzle|selfhit|stun"} 확률적으로 실패(100이면 항상 실패)
 {"t":"backfire","on":ON,"pct":10~100} 기술 위력의 pct%만큼 자기도 다침
 {"t":"selfdmg","on":ON,"amt":1~40} 쓸 때마다 체력 소모 (또는 "pct":5~90 현재 체력의 그만큼, "체력이 절반이 된다"면 pct 50)
 {"t":"selfst","on":ON,"st":{"k":DEBUFF,"d":0.3~5}} 쓰고 나면 자신에게 상태이상
 {"t":"tick","every":3~20,"st":{"k":DEBUFF,"d":0.3~4}} 주기적으로 저절로 상태이상(갑자기 춤추기, 잠들기 등)
 {"t":"when","if":IF,"n"?:숫자,"st":DEBUFF} 조건인 동안 계속 상태이상
 IF(조건): moving 움직임 · still 가만히 · lowhp 체력 n% 이하 · highhp · fullhp 체력 가득 · near 적이 가까이 · far · edge 맵 가장자리 · center 한가운데 · crowd 적 n명 이상 근처 · alone 주변에 아무도 없음 · foelow 가까운 적 체력 낮음 · foehigh · debuffed 상태이상 걸림 · buffed 강화 받음 · idle n초 동안 능력 안 씀 · busy 능력 전부 대기 · ready 궁극기 준비됨 · early 처음 n초 · late n초 이후 · onzone 장판 위 · dashing 돌진 중 · casting 기술 쓰는 중 · lead 체력 1등 · behind 체력 꼴찌. still·moving에 n을 주면 n초 넘게 그럴 때
 act에는 "ev"도 쓸 수 있다: hitfoe 적을 맞힐 때 · kill 적을 쓰러뜨릴 때 · heal 회복할 때 · debuff 상태이상 걸릴 때 · foeskill 근처 적이 능력 쓸 때 · dash 돌진·순간이동할 때 · ally 다른 플레이어가 쓰러질 때 · miss 공격이 빗나갈 때 · buff 강화 받을 때 · crit 치명타 터질 때 ("nth":N이면 N번째마다). hit에도 "nth"를 주면 N번 맞을 때마다
 {"t":"move","mode":"reverse|slide|drunk|nostop|backward|hop|spin"} 걸음이 이상해짐(reverse 방향키 반대, slide 빙판, drunk 비틀비틀, nostop 멈출 수 없음, backward 뒷걸음질, hop 깡총깡총, spin 뱅글뱅글)
 {"t":"vision","mode":"dark|flip|mirror|shake|tiny|zoom"} 그 플레이어 화면만 이상해짐(dark 앞이 거의 안 보임, flip 위아래 뒤집힘, mirror 좌우 뒤집힘, shake 계속 흔들림, tiny 너무 멀리 보임, zoom 코앞만 보임)
 {"t":"pest","every":3~20,"dmg":0~8,"name":"쫓아오는 것 이름","color":"#rrggbb","pix":[12글자 12줄],"st":ST} 주기적으로 무언가가 나타나 자기를 쫓아와 괴롭힘(벌, 비둘기, 엄마 등)

 {"t":"cd","on":ON,"pct":30~400} 재사용 시간 증가

 {"t":"act","text":"말풍선(16자 이내)","pose":"gas|sneeze|hiccup|poop|cry|laugh|sing|yawn|coin|heart|bow|snap|eat|sweat|zzz|star|fall|shout|word","d":0~4,"st"?:{"k":DEBUFF,"d":0.3~4},"fire"?:true,"push"?:true,"hp"?:1~40(그때 체력도 잃음), 언제: "on":ON | "every":2~30 | "hit":true | "ev":사건 | "if":IF ("n"?:숫자) | "bump":true} 부작용에 쓴 행동을 정말로 함. on 쓸 때, every 몇 초마다, hit 맞을 때, if 그 조건이 되는 순간, bump 벽에 부딪힐 때. d초 동안 멈추거나 st 상태이상. fire 능력이 저절로 나감, push 튕겨 날아감
 {"t":"aim","on":ON,"deg":10~90,"chance":10~100} 조준이 빗나감
 {"t":"range","on":ON,"pct":15~80} 사거리가 짧아짐
 {"t":"ramp","stat":"dmg|speed|size","by":"time|hp","pct":10~80} 시간이 지날수록(time)·체력이 줄수록(hp) 점점 약해짐·느려짐·커짐(size는 -60이면 작아짐)
 {"t":"flee","if":"near|lowhp|always"} 그 조건이면 저절로 도망침
 {"t":"weakto","vfx":[VFX,...],"pct":20~300,"name":"물"} 그 종류(vfx)의 공격에 맞으면 피해 증가
덧붙임: selfst·selfdmg·stack·recoil·tele·aidfoe·act·shout에 "nth":2~10을 넣으면 N번 쓸 때마다만. stack에 "hit":true면 맞을 때마다. cd에 "min":1~20이면 그 초에 한 번만. stat size의 pct는 -60(작아짐)~200. uses n은 0~20. move에 left|right|side|vertical(그 방향으로만 움직임)도 있다. pest에 "on":ON을 넣으면 그 기술을 쓸 때 나타난다.`;
}

/** 한 명의 설계서 만들기. sample이 없거나 실패하면 기본 해석기. */
async function forgeSpec(sample, entry, onProgress) {
  const sides = entry.sides || [];
  if (sample) {
    try {
      const ask = (tier) => sample.json(buildPrompt(entry.name, entry.ability, sides), {
        cache: false,
        modelTier: tier,
        onText: ({ text }) => onProgress && onProgress(Math.min(0.95, text.length / 3400)),
      });
      let raw;
      try { raw = await ask(entry.bot ? 'default' : 'complex'); } catch (e) {
        if (e && e.code === 'not_granted') throw e;
        await new Promise((r) => setTimeout(r, 2500));
        raw = await ask(entry.bot ? 'quick' : 'default');
      }
      if (raw && typeof raw === 'object' && raw.moves) return { spec: sanSpec(raw, sides, true), err: null };
      return { spec: fallbackSpec(entry.ability, sides), err: 'invalid_json' };
    } catch (e) {
      return { spec: fallbackSpec(entry.ability, sides), err: (e && e.code) || 'error' };
    }
  }
  return { spec: fallbackSpec(entry.ability, sides), err: 'no_ai' };
}

function guardShort(re) {
  const src = re.source, parts = [];
  let depth = 0, cur = '';
  for (const ch of src) {
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (ch === '|' && depth === 0) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  return new RegExp(parts.map((p) => (/^[가-힣](\(|$)/.test(p) ? '(?<![가-힣])' + p : p)).join('|'), re.flags);
}

function pixFor(word) {
  if (!word) return null;
  for (const [re, color, pix] of PIXBOOK) if (re.test(word)) return { color, pix };
  return null;
}

/* ----- 단어 사전: 단어 계열마다 어울리는 전용 기술 -----
   wfam(계열, 소재, '단어 단어 …', { 칸: 기술 또는 [기술…] }, { st, style, look, stats, passive, title, c })
   기술 = wm(방식, fx(P, S, o), '이름|이름', '설명|설명') — {n}에는 글에 나온 단어가 그대로 들어간다
   단어 앞의 ! 는 "앞뒤가 딱 떨어질 때만" (하마터면, 오리지널 같은 오인식 방지). 한 글자 단어는 자동으로 그렇게 본다 */
const WF = {};
const WF_LIST = [];
function wm(m, fx, name, desc) { return { m, fx, name: name.split('|'), desc: desc.split('|') }; }
function wfam(key, th, words, moves, opt) {
  const ws = words.split(/\s+/).filter(Boolean);
  WF[key] = Object.assign({ key, th, words: ws.map((w) => w.replace(/^!/, '')), moves }, opt || {});
  for (const w of ws) WF_LIST.push([w, key]);
}
const SV = (S, k, d) => ({ k: S || k, d });

   "능력을 쓰면 3초 동안 못 움직인다" → 언제: 능력을 쓸 때 / 무엇: 3초 동안 멈춤

    if (ml >= 0.15 && f.castT <= 0) { if (f.moveMode === 'backward') f.dir = [1, 0, 3, 2][f.dir]; else if (f.moveMode === 'spin') f.dir = [0, 2, 1, 3][Math.floor(this.t * 10) % 4]; }
    if (st.dance) f.dir = [0, 2, 1, 3][Math.floor(this.t * 8) % 4];
    // 쫓아오는 귀찮은 것
    if (live) for (const p of f.pests) {
      p.t -= dt;
      if (p.t <= 0) {
        const x = f.dbs[p.i].fx; p.t = x.every;
        const an = Math.random() * 6.283, sx = clamp(f.x + Math.cos(an) * 90, 12, W - 12), sy = clamp(f.y + Math.sin(an) * 70, 16, H - 12);
        const ev = ['q', f.idx, p.i, 'p' + f.idx + '.' + (++f.actN), Math.round(sx), Math.round(sy)];
        this.emit(ev); this.spawnPest(ev);
      }
    }
    if (f.wind) {
      if (stunned) f.wind = null;
      else { f.wind.t -= dt; if (f.wind.t <= 0) { const s = f.wind.slot, as = f.wind.as; f.wind = null; this.fire(f, s, as); } }
    }
    if (!stunned && live) for (const [s, key] of KEYSLOT) if (inp[key] && f.cd[s] <= 0 && this.tryMove(f, s)) break;
  }

  barrierPush(f, o) {
    const r = 3 * f.size + 2;
    const d = segDist(f.x, f.y, o.ax, o.ay, o.bx, o.by);
    if (d >= r) return;
    const side = (f.x - o.x) * o.nx + (f.y - o.y) * o.ny < 0 ? -1 : 1;
    f.x += o.nx * side * (r - d); f.y += o.ny * side * (r - d);
    if (f.dash) f.dash = null;
  }
  clampArena(p, r) {
    const B = this.map.B;
    if (p.x < B + r) { p.x = B + r; if (p.vx < 0) p.vx = 0; }
    if (p.x > W - B - r) { p.x = W - B - r; if (p.vx > 0) p.vx = 0; }
    if (p.y < B + r + 5) { p.y = B + r + 5; if (p.vy < 0) p.vy = 0; }
    if (p.y > H - B - r) { p.y = H - B - r; if (p.vy > 0) p.vy = 0; }
  }
  solid(p, r, fly) {
    for (let pass = 0; pass < 2; pass++) for (const o of this.map.obs) { if (o.k === 'pit' && fly) continue; pushOut(p, r, o); }
    this.clampArena(p, r);
  }
  moveCollide(f, dt) { f.x += f.vx * dt; f.y += f.vy * dt; this.solid(f, 3 * f.size, !!f.st.fly); }
  freePoint() {
    const B = this.map.B;
    for (let i = 0; i < 60; i++) {
      const x = rnd(B + 14, W - B - 14), y = rnd(B + 18, H - B - 10);
      if (!this.map.obs.some((o) => x > o.x - 8 && x < o.x + o.w + 8 && y > o.y - 8 && y < o.y + o.h + 8) && (!this.stormR || Math.hypot(x - W / 2, y - H / 2) < this.stormR - 10)) return [x, y];
    }
    return [W / 2, H / 2 + 50];
  }

  stepRemote(f, dt) {
    for (const k in f.st) { if (f.st[k] !== true) { f.st[k] -= dt; if (f.st[k] <= 0) delete f.st[k]; } }
    f.flashT -= dt; f.sayCd -= dt; f.castT -= dt;
    if (!f.alive) f.koT += dt;
    const n = f.net;
    if (!n) return;
    const dx = n.x - f.x, dy = n.y - f.y;
    if (dx * dx + dy * dy > 80 * 80) { f.x = n.x; f.y = n.y; }
    else { const k = 1 - Math.exp(-dt * 20); f.x += dx * k; f.y += dy * k; }
  }
  setRemote(idx, a) {
    const f = this.fighters[idx];
    if (!f || f.owned || !Array.isArray(a)) return;
    f.net = { x: +a[0] || 0, y: +a[1] || 0 };
    f.dir = clamp(a[2] | 0, 0, 3);
    f.hp = clamp(+a[3] || 0, 0, f.maxHp);
    f.pose = POSES[a[4] | 0] || 'idle';
    const mask = a[5] | 0;
    f.st = {};
    for (let i = 0; i < ST_ALL.length; i++) if (mask & (1 << i)) f.st[ST_ALL[i]] = true;
    f.size = clamp((+a[6] || 100) / 100, 0.4, 3);
    const fl = a[7] | 0;
    if (!(fl & 1) && f.alive) this.onKO(idx, -1);
    f.warn = !!(fl & 8);
  }
  snapshot(f) {
    let mask = 0;
    for (let i = 0; i < ST_ALL.length; i++) if (f.st[ST_ALL[i]]) mask |= 1 << i;
    return [Math.round(f.x), Math.round(f.y), f.dir, Math.round(f.hp * 10) / 10, Math.max(0, POSES.indexOf(f.pose)), mask, Math.round(f.size * 100), (f.alive ? 1 : 0) | (f.warn ? 8 : 0)];
  }

  stepLook(f, dt) {
    if (f.owned) f.pose = !f.alive ? 'ko' : f.wind ? 'wind' : f.hurtT > 0 || f.st.stun ? 'hurt' : f.castT > 0 ? 'cast' : Math.hypot(f.vx, f.vy) > 12 ? 'run' : 'idle';
    f.hpShow = f.hpShow > f.hp ? Math.max(f.hp, f.hpShow - f.maxHp * 0.6 * dt) : f.hp;
    if (f.say) { f.say.t -= dt; if (f.say.t <= 0) f.say = null; }
    if (!f.alive) return;
    // 발걸음 먼지
    const moved = Math.hypot(f.x - f.px, f.y - f.py);
    if (moved > 0.6) {
      f.stepT -= dt;
      if (f.stepT <= 0) { f.stepT = 0.16; this.addP('smoke', f.x + rnd(-2, 2), f.y, rnd(-6, 6), rnd(-4, 2), 0.35, this.map.dust, 1.5); }
    }
    f.afterT = (f.afterT || 0) - dt;
    if ((f.dash || (f.st.haste && moved > 0.6)) && f.afterT <= 0) { f.afterT = f.dash ? 0.035 : 0.08; this.addP('after', f.x, f.y, 0, 0, f.dash ? 0.16 : 0.2, f.color, 1, { dir: f.dir, f }); }
    if (f.owned && !f.bot && f.cd.ult <= 0 && !f.lock.ult && Math.random() < 0.25) { const an = Math.random() * 6.283; this.addP('px', f.x + Math.cos(an) * 8, f.y + Math.sin(an) * 3, 0, -18, 0.5, pick([GOLD, '#ffffff', f.spec.moves.ult.color]), 1); }
    f.auraT -= dt;
    if (f.auraT <= 0) {
      f.auraT = 0.12 + Math.random() * 0.1;
      const a = f.spec.look.aura, x = f.x + rnd(-4, 4) * f.size, y = f.y - rnd(1, 10) * f.size;
      const A = { flame: ['fire', '#ff8a2f'], frost: ['ice', '#bff0ff'], spark: ['electric', '#ffe14a'], shadow: ['shadow', '#5a3f8c'], leaf: ['nature', '#7ad63a'], star: ['holy', '#fff3a0'], bubble: ['water', '#9fe8ff'], wind: ['wind', '#eafff8'], holy: ['holy', '#fff7c2'], toxic: ['poison', '#b6f24a'] }[a];
      if (A && !f.st.invis) this.vfxTrail(A[0], A[1], x, y, 0, -10, 0.6);
      if (f.st.burn) this.vfxTrail('fire', '#ff7a2f', x, y, 0, -10, 1);
      if (f.st.poison) this.vfxTrail('poison', '#9be04a', x, y, 0, -10, 1);
      if (f.st.regen) this.addP('pat', x, y, 0, -16, 0.5, '#7dff8a', 1, { pat: 'plus' });
      if (f.st.freeze) this.addP('px', x, y, 0, 0, 0.3, '#ffffff', 1);
      if (f.st.confuse) this.addP('pat', f.x + rnd(-5, 5), f.y - 13 * f.size, 0, -6, 0.4, ST_COLOR.confuse, 1, { pat: 'x' });
    }
  }

  /* ---------- 능력 쓰기 ---------- */
  tryMove(f, slot) {
    if (!f.alive || f.wind || f.dash || f.leap || f.st.stun || f.st.freeze || f.st.air || f.hurtT > 0) return false;
    if (f.cd[slot] > 0) return false;
    f.tried[slot] = 1;
    if (f.lock[slot]) {
      f.cd[slot] = f.cdMax[slot] = 0.9;
      this.note(f, '봉인!', '#c5f24a', true);
      for (let i = 0; i < 5; i++) this.addP('smoke', f.x + rnd(-3, 3), this.bodyY(f), rnd(-14, 14), rnd(-20, 0), 0.6, '#8a84b0', 1.5);
      this.addP('pat', f.x, f.y - 15, 0, -8, 0.7, '#c5f24a', 1, { pat: 'x' });
      if (f.lock[slot].say && f.sayCd <= 0) this.trig(f, f.lock[slot]);
      this.sfx('lock');
      return false;
    }
    if (f.st.silence || f.st.morph) { this.note(f, f.st.morph ? '변신 중!' : '침묵!', f.st.morph ? ST_COLOR.morph : ST_COLOR.silence); return false; }
    let as = slot;
    if (f.rnds[slot] && Math.random() * 100 < f.rnds[slot]) {
      const opts = SLOTS.filter((q) => q !== slot && !f.lock[q]);
      if (opts.length) { as = pick(opts); this.note(f, '엉뚱한 기술!', '#c5f24a', true); }
    }
    if (f.uses[slot] <= 0) { this.note(f, '횟수 끝', '#a79fce'); return false; }
    let wt = 0, wd = null;
    for (const d of f.dbs) if (d.fx.t === 'windup' && onMatch(d.fx.on, slot)) { wt += d.fx.time; wd = d; }
    if (wt > 0) { f.wind = { slot, as, t: wt, total: wt }; this.trig(f, wd); return true; }
    this.fire(f, slot, as);
    return true;
  }

  fire(f, slot, as) {
    as = as || slot;
    const sp = f.spec, mv = sp.moves[as];
    let cdm = 1;
    for (const d of f.dbs) if (d.fx.t === 'cd' && onMatch(d.fx.on, slot)) cdm *= 1 + d.fx.pct / 100;
    f.cd[slot] = f.cdMax[slot] = mv.cd * cdm;
    for (const d of f.dbs) if (d.fx.t === 'cd' && d.fx.min && onMatch(d.fx.on, slot)) f.cd[slot] = f.cdMax[slot] = Math.max(f.cd[slot], d.fx.min);
    if (f.uses[slot] !== Infinity) f.uses[slot]--;
    f.castT = slot === 'basic' ? 0.18 : 0.32;
    for (const d of f.dbs) {
      const x = d.fx;
      if (x.t !== 'fail' || !onMatch(x.on, slot) || Math.random() >= x.chance / 100) continue;
      this.trig(f, d);
      this.note(f, '실패!', '#c5f24a', true);
      this.sfx('fail');
      this.addP('pat', f.x, f.y - 14, 0, -10, 0.6, '#c5f24a', 1, { pat: 'x' });
      for (let i = 0; i < 6; i++) this.addP('smoke', f.x + rnd(-3, 3), this.bodyY(f), rnd(-20, 20), rnd(-20, 5), 0.5, '#8a84b0', 2);
      if (x.back === 'selfhit') { this.sfx('selfhit'); this.damage(f, 12, -1); this.pop(f.x, f.y - 12 * f.size, '-12', '#c5f24a', 1); f.flashT = 0.12; this.vfxImpact(mv.vfx, mv.color, f.x, this.bodyY(f), 1); }
      if (x.back === 'stun') this.addStatus(f, 'stun', 1, 0, false);
      return;
    }
    let tgt = this.nearest(f, true);
    if (tgt) f.aim = Math.atan2(this.bodyY(tgt) - this.bodyY(f), tgt.x - f.x);
    if (f.rev[slot] && Math.random() * 100 < f.rev[slot]) { f.aim += Math.PI; tgt = null; this.note(f, '반대로!', '#c5f24a', true); }
    else if (f.aimS[slot] && Math.random() * 100 < f.aimS[slot].chance) { f.aim += (Math.random() * 2 - 1) * f.aimS[slot].deg * Math.PI / 180; tgt = null; this.dEv(f, 'miss'); this.note(f, '빗나감!', '#c5f24a', true); }
    f.dir = ang2dir(f.aim);
    const ca = Math.cos(f.aim), sa = Math.sin(f.aim);
    const crit = sp.passive && sp.passive.k === 'crit' && Math.random() < 0.2;
    const mul = f.base.dmg * (1 - (f.stack.weak || 0)) * f.rampD * f.mulS[as] * (f.st.power ? 1.5 : 1) * (f.st.weak ? 0.6 : 1) * (f.st.giant ? 1.25 : 1) * (sp.passive && sp.passive.k === 'rage' && f.hp / f.maxHp <= 0.4 ? 1.35 : 1) * (crit ? 1.8 : 1);
    let sw = null;
    for (const e of mv.fx) {
      if (f.nofxT.has(e.t)) continue;
      if (e.t === 'blink') {
        if (f.st.heavy) { this.note(f, '무거움', ST_COLOR.heavy); continue; }
        this.doBlink(f, e, tgt, mv);
      } else if (e.t === 'swap' && tgt) {
        sw = [Math.round(f.x), Math.round(f.y)];
        this.vfxImpact(mv.vfx, mv.color, f.x, this.bodyY(f), 1);
        f.x = tgt.x; f.y = tgt.y; f.vx = 0; f.vy = 0;
        if (tgt.owned) { tgt.x = sw[0]; tgt.y = sw[1]; tgt.vx = 0; tgt.vy = 0; }
      }
    }
    if (f.shout[slot]) { const ev = ['t', f.idx, f.shout[slot] === '@name' ? cut(mv.name + '!!', 16) : f.shout[slot], 2]; this.emit(ev); this.onEvent(ev); this.dEv(f, 'talk'); }
    if (f.back[slot]) {
      const amt = r1(Math.max(1, mv.fx.reduce((t, e) => t + fxExpected(e), 0) * mul * f.back[slot] / 100));
      if (f.hp > 0) { this.damage(f, amt, -1); this.pop(f.x, f.y - 12 * f.size, '-' + amt, '#c5f24a', 0.9); f.flashT = 0.12; this.vfxImpact(mv.vfx, mv.color, f.x, this.bodyY(f), 0.6); }
    }
    const act = ['a', f.idx, SLOT_IDX[as], Math.round(f.x), Math.round(f.y), Math.round(f.aim * 180 / Math.PI), ++f.actN, Math.round(mul * 100), crit ? 1 : 0,
      tgt ? Math.round(tgt.x) : -1, tgt ? Math.round(tgt.y) : -1, tgt ? tgt.idx : -1, (Math.random() * 1e9) | 0, sw ? sw[0] : -1, sw ? sw[1] : -1];
    for (const e of mv.fx) {
      if (f.nofxT.has(e.t)) { this.note(f, NOFX_NOTE[e.t] || '안 돼!', '#c5f24a', true); continue; }
      if (e.t === 'leap') {
        if (f.st.heavy) { this.note(f, '무거움', ST_COLOR.heavy); continue; }
        const [lx, ly] = this.leapTarget(f.x, f.y, tgt ? tgt.x : f.x + ca * 70, tgt ? tgt.y : f.y + sa * 70, f.aim, e.dist * f.rangeS[as]);
        const dur = 0.32 + Math.hypot(lx - f.x, ly - f.y) / 500;
        f.leap = { x0: f.x, y0: f.y, x1: lx, y1: ly, t: 0, dur, h: 22 + Math.hypot(lx - f.x, ly - f.y) * 0.2 };
        f.dash = null; f.invT = Math.max(f.invT, dur + 0.05);
      } else if (e.t === 'phantom') {
        if (f.st.heavy) { this.note(f, '무거움', ST_COLOR.heavy); continue; }
        const t = e.dist * f.rangeS[as] / DASH_V;
        f.dash = { vx: ca * DASH_V, vy: sa * DASH_V, t };
        f.invT = Math.max(f.invT, t + 0.08);
      } else if (e.t === 'dash') {
        if (f.st.heavy) { this.note(f, '무거움', ST_COLOR.heavy); continue; }
        const t = e.dist * f.rangeS[as] / DASH_V;
        f.dash = { vx: ca * DASH_V, vy: sa * DASH_V, t };
        if (e.invuln) f.invT = Math.max(f.invT, t + 0.08);
      } else if (e.t === 'buff') this.addStatus(f, e.k, e.d, e.pow || 0, false);
      else if (e.t === 'heal') this.heal(f, e.amt);
    }
    this.emit(act);
    this.spawnAct(act);
    for (let di = 0; di < f.dbs.length; di++) {
      const d = f.dbs[di], x = d.fx;
      if (!x.on || !onMatch(x.on, slot)) continue;
      if (x.nth > 1) { f.nthC[di] = (f.nthC[di] || 0) + 1; if (f.nthC[di] % x.nth) continue; }
      switch (x.t) {
        case 'selfdmg': {
          const amt = x.pct ? r1(f.hp * x.pct / 100) : x.amt;
          if (f.hp > 1 && amt > 0) { this.damage(f, Math.min(amt, f.hp - 1), -1); this.pop(f.x, f.y - 12 * f.size, '-' + amt, '#c5f24a', 0.9); }
          this.trig(f, d); break;
        }
        case 'act': this.doAct(f, di); break;
        case 'pest':
          if (this.t - (f.dLast[di] || -9) > 2.5) {
            f.dLast[di] = this.t;
            const an = Math.random() * 6.283, sx = clamp(f.x + Math.cos(an) * 80, 12, W - 12), sy = clamp(f.y + Math.sin(an) * 60, 16, H - 12);
            const ev = ['q', f.idx, di, 'p' + f.idx + '.' + (++f.actN), Math.round(sx), Math.round(sy)];
            this.emit(ev); this.spawnPest(ev);
          }
          break;
        case 'selfst': this.addStatus(f, x.st.k, x.st.d, 0, false); this.trig(f, d); break;
        case 'recoil': f.vx = -ca * x.force * 34; f.vy = -sa * x.force * 34; f.hurtT = Math.max(f.hurtT, 0.15); f.dash = null; this.trig(f, d); break;
        case 'tele': {
          this.vfxImpact('arcane', '#c5f24a', f.x, this.bodyY(f), 0.8);
          const p = this.freePoint();
          f.x = p[0]; f.y = p[1]; f.vx = 0; f.vy = 0; f.dash = null;
          this.vfxImpact('arcane', '#c5f24a', f.x, this.bodyY(f), 0.8);
          this.trig(f, d); break;
        }
        case 'stack': { const cap = x.stat === 'slow' ? 0.5 : 0.8; f.stack[x.stat] = clamp(f.stack[x.stat] + x.pct / 100, -0.5, cap); this.trig(f, d); break; }
        case 'aidfoe':
          { const t2 = this.nearest(f, false); if (t2) { const ev = ['b', t2.idx, ST_ALL.indexOf(x.k), x.d, x.k === 'shield' ? 20 : 4]; this.emit(ev); this.onEvent(ev); } }
          this.trig(f, d); break;
      }
    }
  }

  /** 도약 착지점: 목표 쪽으로 최대 dist, 벽·구덩이·바깥이면 앞으로 당긴다 (모든 기기에서 같은 결과) */
  leapTarget(x, y, tx, ty, ang, dist) {
    const B = this.map.B;
    let dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
    if (d < 1) { dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
    const L = Math.min(dist, Math.max(20, d));
    for (let k = 0; k < 8; k++) {
      const s2 = L * (1 - k * 0.12), px = clamp(x + dx / d * s2, B + 8, W - B - 8), py = clamp(y + dy / d * s2, B + 10, H - B - 6);
      if (!this.map.obs.some((ob) => px > ob.x - 4 && px < ob.x + ob.w + 4 && py > ob.y - 4 && py < ob.y + ob.h + 4)) return [Math.round(px), Math.round(py)];
    }
    return [x, y];
  }
  /** 조준 방향 가까이에서 가장 가까운 적 (front: 앞쪽만) */
  pickTarget(c, x, y, ang, range, front) {
    let best = null, bd = range;
    for (const v of this.fighters) {
      if (!v.alive || v.gone || v.idx === c.idx) continue;
      const dx = v.x - x, dy = this.bodyY(v) - y, d = Math.hypot(dx, dy);
      if (front) { let da = Math.atan2(dy, dx) - ang; da = Math.atan2(Math.sin(da), Math.cos(da)); if (Math.abs(da) > 1.3) continue; }
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  }
  /** 채찍 곡선 위의 점들 */
  whipPts(o) {
    const p = clamp(1 - o.life / o.max, 0, 1), ca = Math.cos(o.ang), sa = Math.sin(o.ang);
    const L = o.len * Math.min(1, 0.35 + p * 1.6), bend = o.len * 0.45 * o.dirS * (1 - p) * (1 - p);
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const t = k / 8, along = L * t, side = bend * Math.sin(t * Math.PI) * (0.5 + t);
      pts.push([o.x + ca * along - sa * side, o.y + sa * along + ca * side * 0.8]);
    }
    return pts;
  }
  doBlink(f, e, tgt, mv) {
    this.vfxImpact(mv.vfx, mv.color, f.x, this.bodyY(f), 0.7);
    for (let i = 0; i < 3; i++) this.addP('after', f.x, f.y, 0, 0, 0.25 + i * 0.05, mv.color, 1, { dir: f.dir, f });
    const ca = Math.cos(f.aim), sa = Math.sin(f.aim);
    let nx = f.x, ny = f.y;
    switch (e.to) {
      case 'front': nx += ca * e.dist; ny += sa * e.dist; break;
      case 'back': nx -= ca * e.dist; ny -= sa * e.dist; break;
      case 'side': { const s = pick([-1, 1]); nx += -sa * s * e.dist; ny += ca * s * e.dist; break; }
      case 'behind':
        if (tgt) { const dx = tgt.x - f.x, dy = tgt.y - f.y, l = Math.hypot(dx, dy) || 1; nx = tgt.x + dx / l * 12; ny = tgt.y + dy / l * 12; }
        else { nx += ca * e.dist; ny += sa * e.dist; }
        break;

/* ===== 조작: 키보드 · 터치 · 소리 ===== */
const Keys = { down: new Set(), pressed: new Set() };
const GAME_CODES = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyT', 'KeyJ', 'KeyK', 'KeyL', 'KeyI', 'KeyO', 'Semicolon', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad5']);
const typing = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
window.addEventListener('keydown', (e) => {
  if (typing(e.target)) return;
  if (GAME_CODES.has(e.code) && document.body.classList.contains('in-battle')) e.preventDefault();
  if (!e.repeat) { Keys.down.add(e.code); Keys.pressed.add(e.code); }
});
window.addEventListener('keyup', (e) => Keys.down.delete(e.code));
window.addEventListener('blur', () => { Keys.down.clear(); Keys.pressed.clear(); });

const KEYMAPS = {
  solo: { l: ['ArrowLeft', 'KeyA'], r: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], a: ['KeyJ', 'KeyZ', 'Space'], b: ['KeyK', 'KeyX'], c: ['KeyL', 'KeyC'], u: ['KeyI', 'KeyV'] },
  p1: { l: ['KeyA'], r: ['KeyD'], up: ['KeyW'], down: ['KeyS'], a: ['KeyF'], b: ['KeyG'], c: ['KeyH'], u: ['KeyT'] },
  p2: { l: ['ArrowLeft'], r: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], a: ['KeyK', 'Numpad1'], b: ['KeyL', 'Numpad2'], c: ['Semicolon', 'Numpad3'], u: ['KeyO', 'Numpad5'] },
};
const KEY_HINT = {
  solo: { a: 'J', b: 'K', c: 'L', u: 'I', move: '방향키 / WASD' },
  p1: { a: 'F', b: 'G', c: 'H', u: 'T', move: 'W A S D' },
  p2: { a: 'K', b: 'L', c: ';', u: 'O', move: '방향키' },
};

/** 키보드·조이스틱·터치 버튼을 함께 읽는 조작기 */
class Ctrl {
  constructor(mapName) {
    this.map = KEYMAPS[mapName] || KEYMAPS.solo;
    this.held = { a: 0, b: 0, c: 0, u: 0 };
    this.edge = { a: 0, b: 0, c: 0, u: 0 };
    this.joy = null;
  }
  press(k) { this.held[k] = 1; this.edge[k] = 1; }
  release(k) { this.held[k] = 0; }
  clear() { for (const k in this.held) this.held[k] = this.edge[k] = 0; this.joy = null; }
  read() {
    const m = this.map, any = (list) => list.some((c) => Keys.down.has(c));
    const take = (list) => { let hit = false; for (const c of list) if (Keys.pressed.delete(c)) hit = true; return hit; };
    let mx = (any(m.r) ? 1 : 0) - (any(m.l) ? 1 : 0), my = (any(m.down) ? 1 : 0) - (any(m.up) ? 1 : 0);
    if (this.joy) { mx = this.joy.x; my = this.joy.y; }
    const out = { mx, my };
    for (const k of ['a', 'b', 'c', 'u']) { out[k] = (take(m[k]) || any(m[k]) || this.held[k] || this.edge[k]) ? 1 : 0; this.edge[k] = 0; }

  }

/** 버튼에 누르고 있기/떼기 연결 (여러 손가락 동시 입력) */
function bindHold(el, onDown, onUp) {
  const down = (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ } el.classList.add('is-down'); onDown(); };
  const up = (e) => { e.preventDefault(); el.classList.remove('is-down'); if (onUp) onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', () => { el.classList.remove('is-down'); if (onUp) onUp(); });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

    const motif = [];
    for (let i = 0; i < 16; i++) motif.push(R() < (i % 4 === 0 ? 0.85 : i % 2 === 0 ? 0.55 : 0.25) ? Math.floor(R() * 5) : null);
    const answer = motif.map((n, i) => (n == null ? (R() < 0.2 ? Math.floor(R() * 5) : null) : (i > 10 ? Math.floor(R() * 5) : n)));
    this.mel = [motif, answer, motif, answer.map((n, i) => (i >= 12 ? (i === 12 ? 0 : null) : n))];
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop(keepWant) { clearInterval(this.timer); this.timer = 0; this.cur = null; if (!keepWant) this.want = null; },
  setHype(v) { this.hype = v; },
  tick() {
    const c = Sfx.ctx;
    if (!c || !this.tr) return;
    if (c.state !== 'running') return;
    const tr = this.tr, spb = 60 / (tr.bpm * (this.hype ? 1.08 : 1)) / 4;
    while (this.nextT < c.currentTime + 0.15) {
      if (Sfx.musicOn) this.note(this.step, this.nextT + (tr.swing && this.step % 2 ? spb * tr.swing : 0), spb);
      this.nextT += spb; this.step++;
    }
  },
  note(step, t, spb) {
    const tr = this.tr, s16 = step % 16, bar = Math.floor(step / 16) % 4, sc = SCALES[tr.scale];
    const deg = (d) => { const o = Math.floor(d / 7), i = ((d % 7) + 7) % 7; return tr.root + sc[i] + o * 12; };
    const chord = tr.prog[bar];
    const D = Sfx.mbus, O = (type, f, dur, vol, o) => Sfx.osc(type, f, f, t, dur, vol, Object.assign({ dest: D }, o || {})), N = (dur, vol, o) => Sfx.noise(t, dur, vol, Object.assign({ dest: D }, o || {}));
    // 드럼
    if (tr.k[s16] === 'x') { Sfx.osc('sine', 150, 42, t, 0.2, 0.55, { dest: D }); N(0.02, 0.2, { type: 'highpass', f: 2000 }); }
    if (tr.s[s16] === 'x') { N(0.14, 0.3, { type: 'bandpass', f: 1800, q: 0.7 }); Sfx.osc('triangle', 210, 160, t, 0.08, 0.12, { dest: D }); }
    if (tr.h[s16] === 'x' || (this.hype && s16 % 2)) N(this.hype && s16 % 4 === 2 ? 0.12 : 0.035, 0.07, { type: 'highpass', f: 7000 });
    // 베이스
    if (tr.bp[s16] === 'x') O(tr.bass, mtof(deg(chord) - 12), spb * 1.8, 0.16, { lp: 900 });
    // 아르페지오
    const arpDeg = [0, 2, 4, 7][s16 % 4] + chord;
    O(tr.arp, mtof(deg(arpDeg) + 12), spb * 0.9, 0.035, { lp: 3500 });
    // 멜로디
    const m = this.mel[bar][s16];
    if (m != null) {
      const n = deg(chord + [0, 2, 4, 5, 7][m]) + 12 + (this.hype ? 12 : 0);
      O(tr.lead, mtof(n), spb * 1.9, 0.09, { vib: 6, vibD: 3, echo: 0.25, att: 0.01 });
    }
    // 마디 첫 박에 쨍한 소리
    if (s16 === 0 && bar === 0) N(0.5, 0.06, { type: 'highpass', f: 5000, verb: 0.3 });
  },
};

/* ---- 대사 읽기 (브라우저 음성, 없으면 조용히 넘어감) ---- */
const Voice = {
  last: 0,
  say(text, seed, big) {
    if (!Sfx.voiceOn || !Sfx.on || !text || !window.speechSynthesis) return;
    const now = performance.now();
    if (now - this.last < (big ? 300 : 1400)) return;
    this.last = now;
    try {
      const vs = window.speechSynthesis.getVoices();
      if (vs.length && !vs.some((x) => /^ko/i.test(x.lang))) return; // 한국어 목소리가 없으면 읽지 않는다
      const ko = vs.find((x) => /^ko/i.test(x.lang));
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; if (ko) u.voice = ko; u.rate = 1.25 + (seed || 0) * 0.3; u.pitch = 0.6 + (seed || 0) * 1.3; u.volume = big ? 1 : 0.85;
      if (big) window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) { /* 없어도 됨 */ }
  },
};

/* ===== 온라인: 같은 페이지를 연 사람들과 상태(presence)로 동기화 ===== */
const utf8 = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
const byteLen = (s) => (utf8 ? utf8.encode(s).length : s.length * 3);

const Net = {
  room: null, tried: false, err: null,
  seq: 0, ring: [], bn: -1,
  seen: new Map(), lastSeq: new Map(),
  docTimer: null, rk: null, rparts: null, rdone: null,

  async init() {
    if (this.tried) return this.room;
    this.tried = true;
    try { this.room = window.claude && window.claude.use ? await window.claude.use('room') : null; } catch (e) { this.room = null; }
    return this.room;
  },
  peers() { try { return this.room ? this.room.peers() : []; } catch (e) { return []; } },
  me() { return this.peers().find((p) => p.sameTab) || null; },
  set(patch) {
    if (!this.room) return;
    try { this.room.presence(patch).catch((e) => { this.err = (e && e.code) || 'error'; }); } catch (e) { this.err = 'error'; }
  },
  /** 입장한 사람들 (먼저 들어온 순서). 맨 앞이 방장. */
  players() {
    return this.peers()
      .filter((p) => p.kind !== 'agent' && p.presence && p.presence.g === 1 && typeof p.presence.j === 'number')
      .sort((a, b) => a.presence.j - b.presence.j || (a.peer < b.peer ? -1 : 1));
  },

  /* ----- 전투 이벤트 ----- */
  startBattle(bn) { this.bn = bn; this.ring = []; this.lastSeq.clear(); this.seen.clear(); },
  send(ev) { this.ring.push({ s: ++this.seq, t: performance.now(), e: ev }); },
  publish(snaps) {
    const t = performance.now();
    while (this.ring.length && (t - this.ring[0].t > 1300 || this.ring.length > 28)) this.ring.shift();
    let ev = this.ring.map((r) => [r.s].concat(r.e));
    while (ev.length > 4 && byteLen(JSON.stringify(ev)) > 2300) ev = ev.slice(Math.ceil(ev.length / 4));
    this.set({ eb: this.bn, f: snaps, ev });
  },
  /** 다른 사람들의 상태와 이벤트를 전투에 반영 */
  pollBattle(battle, ownerOf) {
    for (const p of this.peers()) {
      if (p.sameTab || p.kind === 'agent') continue;
      const pr = p.presence;
      if (!pr || this.seen.get(p.peer) === pr) continue;
      this.seen.set(p.peer, pr);
      if (pr.eb !== this.bn) continue;
      if (pr.f && typeof pr.f === 'object') {
        for (const k in pr.f) { const idx = +k; if (ownerOf(idx) === p.peer) battle.setRemote(idx, pr.f[k]); }
      }
      if (Array.isArray(pr.ev)) {
        let last = this.lastSeq.has(p.peer) ? this.lastSeq.get(p.peer) : -1;
        for (const row of pr.ev) {
          if (!Array.isArray(row) || !(row[0] > last)) continue;
          last = row[0];
          const ev = row.slice(1), t = ev[0];
          if ((t === 'a' || t === 's' || t === 'k') && ownerOf(ev[1] | 0) !== p.peer) continue;
          if (t === 'h' && ownerOf(ev[2] | 0) !== p.peer) continue;
          try { battle.onRemote(ev); } catch (e) { /* 잘못된 이벤트는 버린다 */ }
        }
        this.lastSeq.set(p.peer, last);
      }
    }
  },

  /* ----- 큰 문서(설계서 묶음)를 조각내어 돌려 보내기 ----- */
  docSend(key, text) {
    this.docStop();
    const parts = [], chars = Array.from(text);
    for (let i = 0; i < chars.length; i += 400) parts.push(chars.slice(i, i + 400).join(''));
    let i = 0;
    const tick = () => { this.set({ ch: { k: key, i, n: parts.length, d: parts[i] } }); i = (i + 1) % parts.length; };
    tick();
    this.docTimer = setInterval(tick, 180);
  },
  docStop() { if (this.docTimer) { clearInterval(this.docTimer); this.docTimer = null; this.set({ ch: null }); } },
  /** 방장이 돌려 보내는 조각을 모은다. 다 모이면 문자열, 아니면 null */
  docPoll(hostPeer, key) {
    if (this.rk !== key) { this.rk = key; this.rparts = []; this.rdone = null; }
    if (this.rdone) return this.rdone;
    const ch = hostPeer && hostPeer.presence && hostPeer.presence.ch;
    if (!ch || ch.k !== key || typeof ch.d !== 'string' || !(ch.n > 0) || ch.n > 80) return null;
    this.rparts[ch.i | 0] = ch.d;
    for (let i = 0; i < ch.n; i++) if (typeof this.rparts[i] !== 'string') return null;
    this.rdone = this.rparts.slice(0, ch.n).join('');
    return this.rdone;
  },
  docProgress() { return this.rparts ? this.rparts.filter((x) => typeof x === 'string').length : 0; },
};

function mkStage() {
  const screen = h('canvas.screen', { width: 300, height: 200 });
  const el = h('div.stage', screen);
  const fitText = () => {
    const r = el.getBoundingClientRect();
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), hh = Math.max(1, Math.round(r.height * dpr));
    if (screen.width !== w || screen.height !== hh) { screen.width = w; screen.height = hh; }
  };
  return { el, world: screen, text: screen, fitText };
}

function runLoop(battle, stage, hooks) {
  let raf = 0, last = performance.now(), acc = 0, frame = 0, stopped = false;
  const DT = 1 / 60;
  const tick = (t) => {
    if (stopped) return;
    raf = requestAnimationFrame(tick);
    acc += Math.min(0.25, Math.max(0, (t - last) / 1000)); last = t;
    if (hooks && hooks.pre) hooks.pre();
    let n = 0;
    while (acc >= DT && n < 6) { battle.step(DT); acc -= DT; n++; }
    if (n === 6) acc = 0;
    if ((frame & 31) === 0) stage.fitText();
    battle.draw(n ? n * DT : 0);
    if (hooks && hooks.post) hooks.post(frame);
    frame++;
  };
  raf = requestAnimationFrame(tick);
  return () => { stopped = true; cancelAnimationFrame(raf); };
}

/** 캐릭터 초상화 (픽셀 그대로 키워서 보여 준다) */

/** 터치 조이스틱: 누른 곳에서 끌어당긴 방향으로 움직인다 */
function mkJoy(f) {
  const knob = h('i');
  const el = h('div.joy', { role: 'group', 'aria-label': `${f.name} 이동 조이스틱`, style: { '--pc': f.color } }, knob);
  let id = null, cx = 0, cy = 0, rad = 40;
  const set = (e) => {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const l = Math.hypot(dx, dy);
    if (l > rad) { dx = dx / l * rad; dy = dy / l * rad; }
    knob.style.setProperty('--jx', dx + 'px'); knob.style.setProperty('--jy', dy + 'px');
    const m = Math.hypot(dx, dy) / rad;
    f.ctrl.joy = m < 0.2 ? { x: 0, y: 0 } : { x: dx / rad / Math.max(m, 0.001) * Math.min(1, m * 1.4), y: dy / rad / Math.max(m, 0.001) * Math.min(1, m * 1.4) };
  };
  const end = () => { id = null; f.ctrl.joy = null; knob.style.setProperty('--jx', '0px'); knob.style.setProperty('--jy', '0px'); el.classList.remove('is-down'); };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); Sfx.init();
    id = e.pointerId; try { el.setPointerCapture(id); } catch (err) { /* 무시 */ }
    const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; rad = r.width * 0.36;
    el.classList.add('is-down'); set(e);
  });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === id) { e.preventDefault(); set(e); } });
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  return el;
}

function mkPads(humans) {
  const duo = humans.length > 1;
  const el = h('div.pads' + (duo ? '.duo' : ''));
  const skill = [];
  humans.forEach((f) => {
    const hint = KEY_HINT[f.keymap] || KEY_HINT.solo;
    const sk = (k, slot) => {
      const mv = f.spec.moves[slot];
      const cdn = h('span.cdn'), lbl = h('span.lbl', mv.name);
      const ic = glyphIcon(rowsOf(mv.shape, mv.pix), mv.color);
      const lk = !!f.lock[slot];
      const b = h('button.pb' + (lk ? '.locked' : ''), { type: 'button', 'data-k': k, 'aria-label': `${SLOT_KO[slot]} ${mv.name}${lk ? ' (봉인)' : ''}`, style: { '--pc': mv.color } }, h('span.cdfill'), ic, lbl, h('span.key', App.touch ? SLOT_KO[slot] : hint[k]), cdn, lk ? h('span.lockx', '봉인') : null);
      bindHold(b, () => { Sfx.init(); f.ctrl.press(k); }, () => f.ctrl.release(k));
      skill.push({ f, slot, b, cdn, last: -1, was: 0 });
      return b;
    };
    const pad = h('div.pad', App.touch ? mkJoy(f) : null, h('div.pad-act', sk('a', 'basic'), sk('b', 's1'), sk('c', 's2'), sk('u', 'ult')));
    if (!App.touch) pad.classList.add('keys');
    el.append(pad);
    if (!App.touch) el.append(h('p.pad-help', `${f.name} · 이동 ${hint.move} · 능력 ${hint.a} ${hint.b} ${hint.c} ${hint.u} · 가장 가까운 적을 자동 조준`));
  });
  const update = () => {
    for (const s of skill) {
      const f = s.f, cd = f.cd[s.slot], mx = f.cdMax[s.slot] || 1;
      const frac = cd > 0 ? clamp(cd / mx, 0, 1) : 0;
      const q = Math.round(frac * 40);
      if (q !== s.last) { s.last = q; s.b.style.setProperty('--cd', frac.toFixed(3)); }
      if (s.was > 0 && cd <= 0 && f.alive) { s.b.classList.remove('ready'); void s.b.offsetWidth; s.b.classList.add('ready'); if (s.slot === 'ult') Sfx.play('ready'); }
      s.was = cd;
      const uses = f.uses[s.slot];
      const t = cd >= 1 ? String(Math.ceil(cd)) : uses !== Infinity ? 'x' + uses : '';
      if (s.cdn.textContent !== t) s.cdn.textContent = t;
      s.b.classList.toggle('off', !f.alive || uses <= 0 || !!f.st.silence || !!f.st.morph);
    }
  };
  return { el, update };
}

/** 전투 화면 전체 */
function battleView(o) {
  const stage = mkStage();
  const roster = o.roster.map((e) => {
    const r = Object.assign({}, e);
    if (e.owned && !e.bot && !e.dummy) r.ctrl = new Ctrl(e.keymap || 'solo');
    return r;
  });
  const focus = roster.map((e, i) => (e.owned && !e.bot && !e.dummy ? i : -1)).filter((i) => i >= 0);
  const battle = new Battle({ canvas: stage.world, roster, mapIdx: o.mapIdx, net: o.net ? Net : null, decider: o.decider, onEnd: o.onEnd, sfx: (n, st, ex) => Sfx.play(n, st, ex), focus, practice: o.practice });
  Music.play(o.mapIdx);

  const pop = h('div.snd-pop',
    tog('효과음', () => Sfx.on, (v) => { Sfx.on = v; Sfx.save(); }),
    tog('음악', () => Sfx.musicOn, (v) => Sfx.setMusic(v)),
    tog('목소리', () => Sfx.voiceOn, (v) => { Sfx.voiceOn = v; Sfx.save(); if (!v && window.speechSynthesis) window.speechSynthesis.cancel(); }));
  const sndB = h('button.sndb', { type: 'button', 'aria-expanded': 'false', on: { click: () => { Sfx.init(); const open = pop.classList.toggle('open'); sndB.setAttribute('aria-expanded', String(open)); } } }, '소리');
  const snd = h('div.snd', sndB, pop);
  let armed = 0;
  const quit = h('button', { type: 'button', on: { click: () => { if (Date.now() - armed < 2500) o.onQuit(); else { armed = Date.now(); quit.textContent = '한 번 더 누르면 나가기'; setTimeout(() => { quit.textContent = 'EXIT'; }, 2500); } } } }, 'EXIT');
  const info = h('div.bt-info', humans.map((f) => h('div', { style: { '--pc': f.color } }, h('b', `${f.name}의 부작용`), f.spec.drawbacks.length ? f.spec.drawbacks.flatMap((d) => allRules(d).map((r) => h('span', r))) : h('span', '없음'))));
  if (o.practice) timer.style.display = 'none';
  const wrap = h('div.stage-wrap', stage.el, timer, h('div.bt-tools', snd, o.onQuit ? quit : null), humans.length ? info : null, o.overlay || null);
  const el = h('div.battle', hud.el, wrap, humans.length ? pads.el : null);
  const fit = () => {
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    if (!cw || !ch) return;
    // 화면 비율에 맞춰 무대를 최대한 넓게 (카메라가 보이는 범위를 맞춘다)
    const infoH = humans.length && ch > cw * 1.2 ? Math.min(70, 26 + 18 * humans.length) : 0;
    const avail = ch - infoH;
    let w = cw, sh = avail;

    pre: () => { if (o.net) Net.pollBattle(battle, o.ownerOf); if (o.tick) o.tick(battle); },
    post: (frame) => {

        const t = Math.max(0, battle.t - 2.7);

/* ===== MC 왕수다: 그림·대사 도우미 (경매 쇼 076-stage.js가 쓴다) ===== */
const MC_NAME = 'MC 왕수다';

/** MC 그림 (24×34 픽셀). pose: talk | point | hype | shock | wait | done */
function mcDraw(g, t, pose, open) {

  const PN = '#2e2660', SH = '#0e0b1e', BT = '#ff4d6d', GL = '#0e0b1e', MIC = '#b8b8cc', MICD = '#4a4a5e', MO = '#5a1a2a';
  // 스포트라이트와 그림자

  g.beginPath(); g.moveTo(8, 0); g.lineTo(16, 0); g.lineTo(23, 34); g.lineTo(1, 34); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(5, 32, 14, 2);
  // 다리·신발
  r(9, 24, 3, 6, PN); r(13, 24, 3, 6, PN); r(8, 30, 4, 2, SH); r(13, 30, 4, 2, SH);
  // 반짝이 재킷
  r(7, 15, 10, 10, JK); r(7, 15, 1, 10, JKD); r(16, 15, 1, 10, JKD); r(7, 24, 3, 1, JKD); r(14, 24, 3, 1, JKD);
  r(11, 15, 2, 7, '#ffffff'); r(10, 15, 1, 4, JKD); r(13, 15, 1, 4, JKD);
  if (!MC_REDUCED) { const k = Math.floor(t * 6); r(8 + (k * 3) % 8, 17 + (k * 5) % 6, 1, 1, JKL); r(8 + (k * 5 + 4) % 8, 17 + (k * 3 + 2) % 6, 1, 1, JKL); }
  r(10, 15, 1, 2, BT); r(13, 15, 1, 2, BT); r(11, 15, 2, 1, BT);
  // 머리
  r(11, 14, 2, 1, SKD); r(8, 6, 8, 8, SK); r(7, 9, 1, 2, SK); r(16, 9, 1, 2, SK); r(9, 13, 6, 1, SKD);
  r(7, 3, 10, 4, HR); r(8, 2, 9, 1, HR); r(14, 1, 4, 2, HR); r(9, 3, 4, 1, HRL); r(15, 1, 2, 1, HRL); r(8, 6, 1, 3, HR); r(15, 6, 1, 3, HR);
  if (pose === 'shock') {
    // 선글라스를 이마로 올리고 눈이 휘둥그레
    r(8, 5, 8, 1, GL); r(9, 8, 2, 2, '#ffffff'); r(13, 8, 2, 2, '#ffffff'); r(10, 9, 1, 1, GL); r(13, 9, 1, 1, GL);
    r(10, 10, 4, 1, HR); r(11, 11, 2, 2, MO);
  } else {
    r(8, 8, 8, 2, GL); r(12, 8, 1, 1, '#2e2660'); r(9, 8, 1, 1, '#7fd8ff'); r(13, 8, 1, 1, '#7fd8ff');
    r(10, 10, 4, 1, HR);
    if (open) { r(10, 11, 4, 2, MO); r(11, 12, 2, 1, '#ff8a9a'); } else if (pose === 'hype' || pose === 'done') { r(10, 11, 4, 1, MO); r(9, 10, 1, 1, MO); r(14, 10, 1, 1, MO); } else r(10, 11, 4, 1, MO);
  }
  // 마이크 든 손 (그림 왼쪽)
  if (pose === 'wait') { r(5, 16, 2, 5, JK); r(5, 21, 2, 2, SK); r(5, 23, 1, 3, MICD); r(4, 26, 2, 2, MIC); }
  else { r(5, 15, 2, 3, JK); r(6, 13, 2, 2, SK); r(7, 12, 1, 2, MICD); r(7, 10, 2, 2, MIC); r(8, 10, 1, 1, '#ffffff'); }
  // 다른 손 (그림 오른쪽): 자세마다 다르다
  const wave = !MC_REDUCED && Math.floor(t * 5) % 2;
  if (pose === 'point') { r(17, 15, 2, 2, JK); r(19, 14, 2, 2, JK); r(21, 13, 2, 2, SK); r(23, 13, 1, 1, SK); }
  else if (pose === 'hype') { r(17, 11, 2, 5, JK); r(17, 8 + (wave ? 0 : 1), 2, 3, SK); }
  else if (pose === 'shock') { r(17, 10, 2, 6, JK); r(18, 7, 2, 3, SK); r(4, 7, 2, 3, SK); }
  else if (pose === 'done') { r(17, 15, 2, 2, JK); r(19, 13, 2, 2, SK); r(20, 11, 1, 2, SK); }
  else if (pose === 'talk' && open) { r(17, 15, 2, 3, JK); r(19, 13, 2, 2, SK); }
  else { r(16, 16, 2, 6, JK); r(16, 22, 2, 2, SK); }
  // 신났을 때 반짝이
  if ((pose === 'hype' || pose === 'done') && !MC_REDUCED) { const k = Math.floor(t * 8); g.fillStyle = '#ffffff'; g.fillRect(1 + (k * 7) % 22, 1 + (k * 11) % 10, 1, 1); g.fillRect(2 + (k * 13) % 20, 2 + (k * 5) % 12, 1, 1); }
}
const mcPick = (a) => a[Math.floor(Math.random() * a.length)];
const mcCut = (s, n) => { const a = Array.from(String(s || '')); return a.length > n ? a.slice(0, n - 1).join('') + '…' : a.join(''); };
/** "**굵게**" 표시를 조각으로 */
function mcSegs(s) { return String(s).split(/\*\*/).map((t, i) => ({ t, b: i % 2 === 1 })).filter((x) => x.t); }
function mcRender(bub, segs, n) {
  const out = [];
  let left = n;
  for (const sg of segs) {
    if (left <= 0) break;
    const a = Array.from(sg.t), part = a.slice(0, left).join('');
    left -= a.length;

/** 대사 읽기: 한국어 목소리가 있을 때만. 끝나면 onEnd */
function mcSpeak(text, onEnd) {
  if (!Sfx.voiceOn || !Sfx.on || !window.speechSynthesis) return false;
  try {
    const vs = window.speechSynthesis.getVoices();
    if (vs.length && !vs.some((x) => /^ko/i.test(x.lang))) return false;
    const ko = vs.find((x) => /^ko/i.test(x.lang));
    const u = new SpeechSynthesisUtterance(text.replace(/[*“”『』「」]/g, '').replace(/…/g, ', '));
    u.lang = 'ko-KR'; if (ko) u.voice = ko; u.rate = 1.35; u.pitch = 1.25; u.volume = 1;
    u.onend = onEnd; u.onerror = onEnd;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

    });
  }
  const start = P([1, 2, 3, 5]), others = entries.filter((x) => x !== e).map((x) => x.name);

  L.push({ cue: 'sold', p: 'done', buyer, price, s: `땅! 땅! 땅! **${buyer}** 님께 **${price}**에 낙찰!!` });

}

function stageShow(entries, key, onDone) {

  const coins = (n) => { for (let i = 0; i < n; i++) addP('coin', Math.random() * LW, -4 - Math.random() * 40, (Math.random() - 0.5) * 10, 50 + Math.random() * 40, 2.2, '#ffcf3a'); };

  /* ---- 그리기 ---- */
  const drawStage = (t) => {

    // 전광판 전구 줄

      const sx = LW * (0.2 + i * 0.3), a = Math.sin(t * (0.6 + i * 0.2) + i * 2) * 0.5, ex = sx + Math.tan(a) * floorY;
      bg.fillStyle = ['rgba(255,77,109,0.07)', 'rgba(127,216,255,0.07)', 'rgba(255,207,58,0.07)'][i];
      bg.beginPath(); bg.moveTo(sx - 2, 0); bg.moveTo(sx + 2, 0); bg.lineTo(ex + 16, floorY); bg.lineTo(ex - 16, floorY); bg.lineTo(sx - 2, 0); bg.fill();

    for (let x = (Math.floor(t) % 2) * 9; x < LW; x += 18) R(x, floorY - 4, 1, fh + 4, '#4a2410');
    R(0, floorY - 4, LW, 1, '#a8642a');
    R(0, floorY + fh, LW, 4, '#2a1408');
    for (let i = 0, x = 5; x < LW; x += 11, i++) { const on = (i + k) % 2; R(x, floorY + fh + 1, 3, 2, on ? '#fff3a0' : '#7a6a3a'); }
  };
  const drawPedestal = (t) => {
    const cx = charX, cy = floorY - 1;

    fillEll(bg, cx, cy + 1, 22, 5, '#8a6a1a');
    fillEll(bg, cx, cy, 21, 4, '#ffcf3a');
    fillEll(bg, cx, cy, 15, 2, '#ffe680');
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * 6.283 + S.spinA;

      R(cx + Math.cos(a) * 20, cy + Math.sin(a) * 4 + 1, 1, 1, (i + Math.floor(t * 8)) % 3 ? '#ffffff' : '#ff4d6d');
    }
  };
  const drawSpot = () => {
    bg.globalCompositeOperation = 'lighter';
    bg.fillStyle = `rgba(255,247,210,${0.08 + 0.1 * S.co})`;
    bg.beginPath(); bg.moveTo(charX - 5, 0); bg.lineTo(charX + 5, 0); bg.lineTo(charX + 26, floorY); bg.lineTo(charX - 26, floorY); bg.fill();
    fillEll(bg, charX, floorY - 1, 26, 6, `rgba(255,247,210,${0.12 + 0.12 * S.co})`);
    bg.globalCompositeOperation = 'source-over';
  };
  const drawChar = (t) => {
    if (!S.e || S.rise >= 1) return;
    const sp = S.e.spec;
    const dir = S.spinT > 0 ? [0, 1, 2, 3][Math.floor(t * 10) % 4] : 0;
    renderSprite(spr, sp.look, { pose: S.pose, t, dir, st: S.st, glow: S.glow, hurt: S.hurt > 0, hurtFlash: S.hurt > 0 && Math.floor(t * 16) % 2 === 0 });
    bg.save(); bg.beginPath(); bg.rect(0, 0, LW, floorY + 2); bg.clip();

  const drawMC = (t) => {

    if (down) R(mcX + 6, floorY - 13, 8, 1, '#ffffff');
  };

    const wL = Math.round(LW / 2 * (1 - S.co * 0.86));
    const COL = ['#6a0a18', '#8a0f1f', '#b5172b', '#d8263c', '#b5172b', '#8a0f1f'];

    for (let x = 0; x < LW; x += 10) { fillEll(bg, x + 5, top, 5, 3, '#8a0f1f'); R(x + 4, top + 2, 2, 2, '#ffcf3a'); }
    R(0, top - 2, LW, 1, '#ffcf3a'); R(0, 2, LW, 1, '#ffcf3a');
  };
  const drawAudience = (t) => {
    const y0 = floorY + fh + 9;
    for (let row = 0; row < 3; row++) {
      const yy = y0 + row * 7, step = 9 - row;
      for (let i = 0, x = (row % 2) * 4 + 2; x < LW; x += step, i++) {
        const j = i * 7 + row * 13, jump = S.cheer > 0 ? Math.abs(Math.sin(t * 11 + j)) * Math.min(1, S.cheer) * 3 : Math.abs(Math.sin(t * 2 + j)) * 0.6;
        const c = row === 2 ? '#15122b' : row === 1 ? '#221c46' : '#2e2856';

      }

  };

      else if (p.k === 'coin') { R(p.x, p.y, 3, 3, '#c9971e'); R(p.x, p.y, 2, 2, Math.floor(p.life * 10) % 2 ? '#ffcf3a' : '#fff6c8'); }
      else if (p.k === 'smoke') { bg.globalAlpha = a * 0.6; fillEll(bg, p.x, p.y, p.s * (1.6 - a * 0.6), p.s * (1.2 - a * 0.4), p.c); }
      else if (p.k === 'glyph') drawGlyph(bg, p.rows, p.c, p.x, p.y, 1, Math.floor(p.life * 8) % 4);

      else if (p.k === 'spark') { R(p.x - 1, p.y, 3, 1, p.c); R(p.x, p.y - 1, 1, 3, p.c); }

  };
  let raf = 0, last = performance.now();
